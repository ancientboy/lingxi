<!DOCTYPE html>
<html lang="zh-CN" data-i18n-page-title="sv.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devices — Lume</title>
  <link rel="stylesheet" href="assets/css/lume.css">
  <style>
    /* Top bar */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 200; border-bottom: 1px solid var(--border-sub);
    }
    .top-bar h1 { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-1); }
    .top-bar-left { display: flex; align-items: center; gap: 8px; }
    .top-bar-right { display: flex; align-items: center; gap: 6px; }
    .back-link {
      display: flex; align-items: center; gap: 3px;
      padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-3); font-size: 12px; text-decoration: none; transition: all var(--transition);
    }
    .back-link:hover { background: var(--bg-hover); color: var(--text-1); }

    /* Server card */
    .server-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; margin-bottom: 10px; transition: all var(--transition);
    }
    .server-card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
    .server-card:hover { box-shadow: var(--shadow-sm); }

    .server-top { display: flex; align-items: center; justify-content: space-between; }
    .server-info { display: flex; align-items: center; gap: 12px; }
    .server-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; background: var(--bg-hover);
    }
    .server-card.active .server-icon { background: var(--accent-soft); }
    .server-name { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--text-1); }
    .server-ip { font-size: 12px; color: var(--text-3); margin-top: 1px; font-family: 'SF Mono', monospace; }
    .server-desc { font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .server-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; }
    .status-dot.running { background: #43e97b; box-shadow: 0 0 6px rgba(67,233,123,0.4); }
    .status-dot.offline { background: #ef4444; }
    .status-dot.pending { background: #fbbf24; animation: dot-pulse 1.5s infinite; }
    .status-dot.unhealthy { background: #fb923c; }
    @keyframes dot-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .server-actions { display: flex; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-sub); flex-wrap: wrap; }
    .active-badge { font-size: 10px; background: var(--accent); color: white; padding: 2px 8px; border-radius: 4px; font-weight: 600; margin-left: 6px; }

    /* Health */
    .health-status { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--text-3); }
    .health-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .health-dot.online { background: #43e97b; }
    .health-dot.offline { background: #ef4444; }
    .health-dot.unknown { background: #d4d4d4; }
    .health-response { color: var(--text-3); font-family: monospace; }

    /* History */
    .btn-history { background: none; border: none; color: var(--accent); font-size: 11px; cursor: pointer; padding: 0; margin-left: auto; font-weight: 500; }
    .btn-history:hover { text-decoration: underline; }
    .history-panel { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
    .history-panel.open { max-height: 600px; }
    .history-content { padding: 10px 0 0; border-top: 1px solid var(--border-sub); margin-top: 8px; }
    .history-timeline { position: relative; padding-left: 14px; }
    .history-timeline::before { content:''; position:absolute; left:3px; top:4px; bottom:4px; width:1px; background:var(--border); }
    .history-item { position: relative; padding: 3px 0 3px 12px; font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
    .history-item::before { content:''; position:absolute; left:-2px; top:50%; transform:translateY(-50%); width:7px; height:7px; border-radius:50%; border:1.5px solid var(--bg-card); }
    .history-item.online::before { background:#43e97b; }
    .history-item.offline::before { background:#ef4444; }
    .history-item .h-time { color: var(--text-3); min-width: 90px; }
    .history-item .h-rt { color: var(--text-3); font-family: monospace; }
    .history-empty { font-size: 11px; color: var(--text-3); padding: 6px 0; }

    /* Modal extras */
    .form-hint { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .field { flex: 1; }
.page-wrap-lg { max-width:800px; margin-top:60px; }
.field-narrow { max-width:120px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  </style>
  <script src="assets/js/i18n.js?v=20260627c"></script>
  <script src="assets/libs/lucide.min.js"></script>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <a href="chat.html" class="back-link">&larr; Chat</a>
    <h1>Devices</h1>
  </div>
  <div class="top-bar-right">
    <button class="btn btn-secondary btn-sm" id="btnRunHealthCheck" onclick="runHealthCheck()">Health Check</button>
    <button class="btn btn-secondary btn-sm" onclick="checkAll()">Check All</button>
  </div>
</div>

<div class="page-wrap" class="page-wrap-lg">
  <div class="page-header">
    <div>
      <div class="page-title">My Devices</div>
      <div class="page-desc">Manage your OpenClaw servers</div>
    </div>
    <button class="btn btn-primary" onclick="showAddModal()">+ Add Device</button>
  </div>
  <div id="serverList"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="serverModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add Device</h3>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editServerId">
      <div class="field">
        <label>Device Name</label>
        <input id="fName" placeholder="e.g. Main Server, Project A">
      </div>
      <div class="form-row">
        <div class="field">
          <label>IP Address *</label>
          <input id="fIp" placeholder="192.168.1.100" required>
        </div>
        <div class="field" class="field-narrow">
          <label>Port</label>
          <input id="fPort" value="18789" type="number">
        </div>
      </div>
      <div class="field">
        <label>OpenClaw Token</label>
        <input id="fToken" placeholder="Gateway control token">
        <div class="form-hint">Found in OpenClaw config: control.token</div>
      </div>
      <div class="field">
        <label>Session ID</label>
        <input id="fSession" placeholder="Control panel URL path segment">
        <div class="form-hint">e.g. from http://ip:18789/<b>8eb2a992</b>/</div>
      </div>
      <div class="field">
        <label>Notes</label>
        <input id="fDesc" placeholder="Optional description">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveServer()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 工具函数 ==========

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getUserId() {
  var urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('userId')) return urlParams.get('userId');
  try { var u = JSON.parse(localStorage.getItem('lingxi_user') || '{}'); if (u.id) return u.id; } catch(e) {}
  try { var u = JSON.parse(localStorage.getItem('user') || '{}'); if (u.id) return u.id; } catch(e) {}
  if (localStorage.getItem('userId')) return localStorage.getItem('userId');
  return '';
}

function getToken() { return localStorage.getItem('lingxi_token') || ''; }
function authHeaders() { var t = getToken(); return t ? { 'Authorization': 'Bearer ' + t } : {}; }

function timeAgo(dateStr) {
  if (!dateStr) return '';
  var diff = Date.now() - new Date(dateStr).getTime();
  if (diff < 0) return 'just now';
  var m = Math.floor(diff/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m/60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

function formatTime(dateStr) {
  if (!dateStr) return '--';
  var d = new Date(dateStr);
  return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

// ========== 状态 ==========
var userId = getUserId();
var servers = [];
var activeServerId = null;
var healthData = {};
var historyData = {};
var expandedCards = {};
var API = '/api/servers';

// ========== 初始化 ==========
if (!userId) {
  var token = getToken();
  if (token) {
    fetch('/api/auth/me', { headers: authHeaders() })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(user) {
        if (user && user.id) { localStorage.setItem('lingxi_user', JSON.stringify(user)); userId = user.id; loadServers(); }
        else showLoginRequired();
      }).catch(function() { showLoginRequired(); });
  } else showLoginRequired();
}

function showLoginRequired() {
  document.getElementById('serverList').innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><div class="title">Please sign in</div><div class="desc"><a href="/">Sign in</a></div></div>';
}

async function loadServers() {
  if (!userId) return;
  try {
    var resp = await fetch(API + '/' + userId);
    var data = await resp.json();
    servers = data.servers || [];
    activeServerId = data.activeServerId;
    renderServers();
    loadAllHealthStatus();
  } catch (err) { console.error('Load failed:', err); }
}

async function loadAllHealthStatus() { for (var i = 0; i < servers.length; i++) loadLatestHealth(servers[i].id); }

async function loadLatestHealth(serverId) {
  try {
    var resp = await fetch('/api/healthcheck/latest/' + serverId, { headers: authHeaders() });
    var data = await resp.json();
    healthData[serverId] = (data.success && data.data) ? data.data : null;
  } catch(e) { healthData[serverId] = null; }
  updateHealthUI(serverId);
}

function updateHealthUI(serverId) {
  var el = document.getElementById('health-' + serverId);
  if (!el) return;
  var h = healthData[serverId];
  if (!h) el.innerHTML = '<span class="health-dot unknown"></span><span>Not checked</span>';
  else if (h.status === 'online') el.innerHTML = '<span class="health-dot online"></span><span>'+timeAgo(h.checkedAt)+' online</span>'+(h.responseTime?'<span class="health-response">('+escapeHtml(h.responseTime)+'ms)</span>':'');
  else el.innerHTML = '<span class="health-dot offline"></span><span>'+timeAgo(h.checkedAt)+' offline</span>';
}

async function loadHistoryLogs(serverId) {
  try {
    var resp = await fetch('/api/healthcheck/logs/' + userId, { headers: authHeaders() });
    var data = await resp.json();
    if (data.success && data.data && data.data.grouped) historyData = data.data.grouped;
  } catch(e) {}
  renderHistoryUI(serverId);
}

function renderHistoryUI(serverId) {
  var el = document.getElementById('history-list-' + serverId);
  if (!el) return;
  var logs = historyData[serverId] || [];
  if (!logs.length) { el.innerHTML = '<div class="history-empty">No history</div>'; return; }
  el.innerHTML = logs.slice(0,20).map(function(log) {
    return '<div class="history-item '+escapeHtml(log.status)+'"><span class="h-time">'+formatTime(log.checkedAt)+'</span><span>'+(log.status==='online'?'Online':'Offline')+'</span>'+(log.responseTime?'<span class="h-rt">'+escapeHtml(log.responseTime)+'ms</span>':'')+'</div>';
  }).join('');
}

function toggleHistory(serverId) {
  var panel = document.getElementById('history-' + serverId);
  var btn = document.getElementById('history-btn-' + serverId);
  if (!panel) return;
  if (expandedCards[serverId]) { panel.classList.remove('open'); expandedCards[serverId] = false; if(btn) btn.textContent='History'; }
  else { expandedCards[serverId]=true; if(btn) btn.textContent='Hide'; if(!historyData[serverId]) loadHistoryLogs(serverId); else renderHistoryUI(serverId); requestAnimationFrame(function(){panel.classList.add('open');}); }
}

async function runHealthCheck() {
  var btn = document.getElementById('btnRunHealthCheck');
  btn.disabled=true; btn.textContent='Checking...';
  try {
    var resp = await fetch('/api/healthcheck/run',{method:'POST',headers:authHeaders()});
    var data = await resp.json();
    if(data.success){showToast('Checked '+(data.data?data.data.checkedServers:0)+' devices');healthData={};historyData={};await loadAllHealthStatus();}
    else showToast(data.error||'Failed');
  }catch(e){showToast('Failed');}
  finally{btn.disabled=false;btn.textContent='Health Check';}
}

function renderServers() {
  var el = document.getElementById('serverList');
  if (!servers.length) { el.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg><div class="title">No devices yet</div><div class="desc">Add your OpenClaw server to get started</div></div>'; return; }
  el.innerHTML = servers.map(function(s) {
    var isActive = s.id === activeServerId;
    var statusMap = {running:'Online',offline:'Offline',pending:'Checking',unhealthy:'Unhealthy'};
    var sc = s.status||'pending';
    return '<div class="server-card '+(isActive?'active':'')+'"><div class="server-top"><div class="server-info"><div class="server-icon">'+(isActive?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke=\"var(--accent)\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m9 12 2 2 4-4\"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke=\"var(--text-3)\" stroke-width=\"2\"><rect x=\"2\" y=\"2\" width=\"20\" height=\"8\" rx=\"2\"/><rect x=\"2\" y=\"14\" width=\"20\" height=\"8\" rx=\"2\"/><circle cx=\"6\" cy=\"6\" r=\"1\"/><circle cx=\"6\" cy=\"18\" r=\"1\"/></svg>')+'</div><div><div class="server-name">'+escapeHtml(s.name||'Unnamed')+(isActive?' <span class="active-badge">Active</span>':'')+'</div><div class="server-ip">'+escapeHtml(s.ip)+':'+(s.openclawPort||18789)+'</div>'+(s.description?'<div class="server-desc">'+escapeHtml(s.description)+'</div>':'')+'</div></div><div class="server-status"><span class="status-dot '+sc+'"></span>'+(statusMap[sc]||sc)+'</div></div><div class="health-status" id="health-'+s.id+'"><span class="health-dot unknown"></span><span>Loading...</span><button class="btn-history" id="history-btn-'+s.id+'" onclick="toggleHistory(\''+s.id+'\')">History</button></div><div class="server-actions"><button class="btn btn-sm btn-secondary" onclick="checkServer(\''+s.id+'\')">Check</button>'+(!isActive?'<button class="btn btn-sm btn-primary" onclick="activateServer(\''+s.id+'\')">Switch</button>':'')+'<button class="btn btn-sm btn-secondary" onclick="editServer(\''+s.id+'\')">Edit</button><button class="btn btn-sm btn-danger" onclick="deleteServer(\''+s.id+'\')">Delete</button></div><div class="history-panel" id="history-'+s.id+'"><div class="history-content"><div class="history-timeline" id="history-list-'+s.id+'"><div class="history-empty">Loading...</div></div></div></div></div>';
  }).join('');
}

async function checkServer(id){showToast('Checking...');try{var r=await fetch(API+'/'+userId+'/'+id+'/check',{method:'POST'});var d=await r.json();showToast(d.healthy?'Online':'Offline');loadServers();}catch(e){showToast('Failed');}}
async function checkAll(){showToast('Checking all...');try{var r=await fetch(API+'/'+userId+'/check-all',{method:'POST'});var d=await r.json();var on=d.results?d.results.filter(function(x){return x.healthy}).length:0;showToast(on+'/'+(d.results?d.results.length:0)+' online');loadServers();}catch(e){showToast('Failed');}}
async function activateServer(id){try{var r=await fetch(API+'/'+userId+'/'+id+'/activate',{method:'POST'});var d=await r.json();showToast(d.message);loadServers();localStorage.setItem('device_switched_at',Date.now().toString());try{var w=window.opener||window.parent;if(w&&w!==window)w.postMessage({type:'device-switched',serverId:id},'*');}catch(e){}}catch(e){showToast('Failed');}}

function showAddModal(){document.getElementById('modalTitle').textContent='Add Device';document.getElementById('editServerId').value='';document.getElementById('fName').value='';document.getElementById('fIp').value='';document.getElementById('fPort').value='18789';document.getElementById('fToken').value='';document.getElementById('fSession').value='';document.getElementById('fDesc').value='';document.getElementById('serverModal').classList.add('active');}
function editServer(id){var s=servers.find(function(x){return x.id===id});if(!s)return;document.getElementById('modalTitle').textContent='Edit Device';document.getElementById('editServerId').value=s.id;document.getElementById('fName').value=s.name||'';document.getElementById('fIp').value=s.ip||'';document.getElementById('fPort').value=s.openclawPort||18789;document.getElementById('fToken').value=s.openclawToken||'';document.getElementById('fSession').value=s.openclawSession||'';document.getElementById('fDesc').value=s.description||'';document.getElementById('serverModal').classList.add('active');}
function closeModal(){document.getElementById('serverModal').classList.remove('active');}

async function saveServer(){
  var editId=document.getElementById('editServerId').value;
  var body={name:document.getElementById('fName').value,ip:document.getElementById('fIp').value,openclawPort:parseInt(document.getElementById('fPort').value)||18789,openclawToken:document.getElementById('fToken').value,openclawSession:document.getElementById('fSession').value,description:document.getElementById('fDesc').value};
  if(!body.ip){showToast('IP required');return;}
  try{var r;if(editId)r=await fetch(API+'/'+userId+'/'+editId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});else r=await fetch(API+'/'+userId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json();if(r.ok){showToast(editId?'Updated':'Added');closeModal();loadServers();}else showToast(d.error||'Failed');}catch(e){showToast('Save failed');}
}

async function deleteServer(id){var s=servers.find(function(x){return x.id===id});if(!s)return;if(!confirm('Delete "'+(s.name||s.ip)+'"?'))return;try{var r=await fetch(API+'/'+userId+'/'+id,{method:'DELETE'});if(r.ok){showToast('Deleted');loadServers();}}catch(e){showToast('Failed');}}

function showToast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove();},300);},2500);}
document.getElementById('serverModal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('DOMContentLoaded',loadServers);
</script>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
