<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Office Test</title>
<style>
* { margin:0; padding:0; }
body { background:#f0f0f0; overflow:hidden; height:100vh; }
canvas { width:100%; height:100vh; display:block; }
#err { position:fixed; top:10px; left:10px; background:red; color:#fff; padding:10px; z-index:999; display:none; }
</style>
</head>
<body>
<div id="err"></div>
<canvas id="c"></canvas>
<script src="assets/js/office-engine.js"></script>
<script>
window.onerror = function(msg,src,line) {
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent = line + ': ' + msg;
};
try {
  var c = document.getElementById('c');
  var o = initOffice(c, {});
  document.title = 'OK ' + c.width + 'x' + c.height;
} catch(e) {
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent = e.message;
}
</script>
</body>
</html>
