<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lume Office</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f5f0eb; overflow: hidden; height: 100vh; }
.status-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
  padding: 12px 24px; display: flex; align-items: center; gap: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.status-bar h2 { font-size: 20px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.5px; }
.status-bar h2 span { color: #6366f1; }
.agent-status-list { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }
.agent-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px;
  background: rgba(0,0,0,0.04); font-size: 13px; font-weight: 500;
  transition: background 0.3s;
}
.agent-pill.offline { opacity: 0.4; }
.agent-pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.agent-pill .status-text { color: #888; font-size: 11px; }
canvas { display: block; width: 100vw; height: 100vh; }

.label-container { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
.agent-label {
  position: absolute; transform: translate(-50%, -100%);
  background: rgba(255,255,255,0.9); backdrop-filter: blur(4px);
  padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
  white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  pointer-events: none; transition: opacity 0.3s;
  border: 1px solid rgba(0,0,0,0.06);
}
.agent-label::after {
  content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 4px solid rgba(255,255,255,0.9);
}
</style>
</head>
<body>

<div class="status-bar">
  <h2><span>●</span> Lume Office</h2>
  <div class="agent-status-list" id="agentList"></div>
</div>
<div class="label-container" id="labelContainer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ─── AGENT DATA ───
const agents = [
  { name: 'Lingxi', color: '#6366f1', state: 'idle', zone: 'lounge' },
  { name: 'Spark',  color: '#10a37f', state: 'working', zone: 'workstation' },
  { name: 'Pulse',  color: '#f59e0b', state: 'idle', zone: 'fitness' },
  { name: 'Nova',   color: '#8b5cf6', state: 'idle', zone: 'meeting' },
  { name: 'Scope',  color: '#06b6d4', state: 'working', zone: 'workstation' },
  { name: 'Echo',   color: '#ef4444', state: 'idle', zone: 'lounge' },
  { name: 'Prism',  color: '#ec4899', state: 'offline', zone: null },
  { name: 'Nest',   color: '#3b82f6', state: 'working', zone: 'workstation' },

// ─── ZONE POSITIONS ───
const zones = {
  workstation: {
    center: new THREE.Vector3(-6, 0, -3),
    chairs: [
      new THREE.Vector3(-8.5, 0, -5.05),
      new THREE.Vector3(-6.5, 0, -5.05),
      new THREE.Vector3(-4.5, 0, -5.05),
      new THREE.Vector3(-8.5, 0, -2.05),
      new THREE.Vector3(-6.5, 0, -2.05),
      new THREE.Vector3(-4.5, 0, -2.05),
    ]
  },
  lounge: {
    center: new THREE.Vector3(5, 0, -3),
    wander: [
      new THREE.Vector3(4, 0, -5),

      new THREE.Vector3(5, 0, -1.5),
      new THREE.Vector3(3.5, 0, -3),
    ]

  fitness: {
    center: new THREE.Vector3(-6, 0, 5),
    wander: [
      new THREE.Vector3(-8, 0, 4),
      new THREE.Vector3(-5, 0, 6),
      new THREE.Vector3(-7, 0, 3.5),
      new THREE.Vector3(-4, 0, 5.5),
    ]
  },
  meeting: {
    center: new THREE.Vector3(5, 0, 5),
    wander: [
      new THREE.Vector3(4, 0, 4),
      new THREE.Vector3(6, 0, 6),
      new THREE.Vector3(3.5, 0, 5.5),
      new THREE.Vector3(6.5, 0, 4.5),

const allZones = ['lounge', 'fitness', 'meeting'];

// ─── THREE.JS SETUP ───
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0ebe4);

// Fixed top-down camera (正上方俯视，略微倾斜保留立体感)
const aspect = window.innerWidth / window.innerHeight;
const d = 12;
const camera = new THREE.OrthographicCamera(-d*aspect, d*aspect, d, -d, 0.1, 200);
camera.position.set(0, 30, 8);
camera.lookAt(0, 0, 0);

// ─── LIGHTING ───
const ambient = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
dirLight.position.set(5, 25, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -20; dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20; dirLight.shadow.camera.bottom = -20;
dirLight.shadow.camera.near = 1; dirLight.shadow.camera.far = 50;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const hemiLight = new THREE.HemisphereLight(0xddeeff, 0xdfd7c4, 0.3);
scene.add(hemiLight);

// ─── HELPERS ───
function box(w, h, d, color, x, y, z, castShadow=true) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinder(rT, rB, h, color, x, y, z, segs=8) {
  const g = new THREE.CylinderGeometry(rT, rB, h, segs);
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.8, metalness: 0.05 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function sphere(r, color, x, y, z) {
  const g = new THREE.SphereGeometry(r, 12, 8);
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.05 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

// ─── FLOOR ───
// Main floor
const floorGeo = new THREE.PlaneGeometry(30, 22);
const floorMat = new THREE.MeshStandardMaterial({ color: 0xe8d5b7, roughness: 0.95 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Zone floor patches
function zoneFloor(x, z, w, d, color) {
  const g = new THREE.PlaneGeometry(w, d);
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
  const mesh = new THREE.Mesh(g, m);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0.01, z);
  mesh.receiveShadow = true;
  scene.add(mesh);
}
zoneFloor(-6, -3, 10, 8, 0xe3ddd4); // workstation
zoneFloor(5, -3, 8, 8, 0xede3d3);   // lounge
zoneFloor(-6, 5, 10, 8, 0xdce8d8);   // fitness
zoneFloor(5, 5, 8, 8, 0xd8dde8);     // meeting

// Grid lines on floor
const gridHelper = new THREE.GridHelper(30, 30, 0xddd0be, 0xddd0be);
gridHelper.position.y = 0.02;
gridHelper.material.opacity = 0.3;
gridHelper.material.transparent = true;
scene.add(gridHelper);

// ─── WORKSTATION AREA ───
const workstationPositions = [
  [-8.5, -4.5], [-6.5, -4.5], [-4.5, -4.5],
  [-8.5, -1.5], [-6.5, -1.5], [-4.5, -1.5],
];

const screenLights = [];
workstationPositions.forEach(([x, z]) => {
  // Desk
  box(1.4, 0.06, 0.8, 0xc4a882, x, 0.75, z);
  // Legs
  box(0.06, 0.75, 0.06, 0x8b7355, x-0.6, 0.375, z-0.3);
  box(0.06, 0.75, 0.06, 0x8b7355, x+0.6, 0.375, z-0.3);
  box(0.06, 0.75, 0.06, 0x8b7355, x-0.6, 0.375, z+0.3);
  box(0.06, 0.75, 0.06, 0x8b7355, x+0.6, 0.375, z+0.3);
  // Monitor
  box(1.0, 0.65, 0.04, 0x2a2a3a, x, 1.1, z+0.3);
  // Screen glow
  const screenMat = new THREE.MeshStandardMaterial({
    color: 0x334455, emissive: 0x4488cc, emissiveIntensity: 0.3, roughness: 0.3
  });
  const screenMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.55, 0.02), screenMat);
  screenMesh.position.set(x, 1.1, z+0.32);
  scene.add(screenMesh);
  // Monitor stand
  box(0.08, 0.25, 0.08, 0x3a3a4a, x, 0.88, z+0.3);
  // Screen light
  const sl = new THREE.PointLight(0x4488cc, 0.15, 3);
  sl.position.set(x, 1.2, z+0.1);
  scene.add(sl);
  screenLights.push(sl);
  // Chair (behind desk)
  cylinder(0.22, 0.22, 0.06, 0x555566, x, 0.55, z-0.55); // seat
  box(0.5, 0.55, 0.06, 0x555566, x, 0.85, z-0.8); // backrest
  cylinder(0.03, 0.03, 0.5, 0x444444, x, 0.27, z-0.55); // pole
  // Keyboard
  box(0.5, 0.02, 0.18, 0x3a3a4a, x, 0.78, z+0.05);
});

// ─── LOUNGE AREA ───
// L-shaped sofa
box(3.5, 0.45, 0.9, 0xb88a6a, 4.5, 0.225, -5.5); // long seat
box(0.9, 0.45, 2.5, 0xb88a6a, 2.5, 0.225, -4.25); // short seat
box(3.5, 0.5, 0.15, 0xa0785a, 4.5, 0.5, -6.0); // long back
box(0.15, 0.5, 2.5, 0xa0785a, 2.0, 0.5, -4.25); // short back
// Cushions
sphere(0.3, 0xd4956a, 3.5, 0.6, -5.2);
sphere(0.3, 0xc9886a, 5.5, 0.6, -5.2);

// Coffee table
box(1.4, 0.04, 0.8, 0x8b7355, 4.5, 0.35, -4.0);
cylinder(0.04, 0.04, 0.35, 0x6b5b45, 4.0, 0.175, -3.7);
cylinder(0.04, 0.04, 0.35, 0x6b5b45, 5.0, 0.175, -3.7);
cylinder(0.04, 0.04, 0.35, 0x6b5b45, 4.0, 0.175, -4.3);
cylinder(0.04, 0.04, 0.35, 0x6b5b45, 5.0, 0.175, -4.3);

// Coffee machine
box(0.35, 0.45, 0.3, 0x555566, 7.0, 0.225, -5.5);
cylinder(0.08, 0.08, 0.1, 0x888888, 7.0, 0.5, -5.5);
box(0.25, 0.15, 0.15, 0x444444, 7.0, 0.55, -5.5);
// Cup on table
cylinder(0.06, 0.05, 0.1, 0xf0f0f0, 4.3, 0.42, -4.0);

// Plant
cylinder(0.15, 0.12, 0.3, 0x8b6b4a, 7.0, 0.15, -3.0);
sphere(0.35, 0x5a9a5a, 7.0, 0.65, -3.0);
sphere(0.25, 0x6aaa6a, 6.8, 0.8, -3.2);
sphere(0.2, 0x4a8a4a, 7.2, 0.75, -2.8);

// Warm light for lounge
const loungeLight = new THREE.PointLight(0xffe4b5, 0.3, 8);
loungeLight.position.set(5, 2, -3);
scene.add(loungeLight);

// ─── FITNESS AREA ───
// Yoga mats (flat colorful boxes)
box(1.8, 0.02, 0.7, 0xa8d5a2, -8.0, 0.02, 4.5);
box(1.8, 0.02, 0.7, 0xd5a2a8, -5.5, 0.02, 4.5);

// Dumbbells
cylinder(0.12, 0.12, 0.04, 0x555555, -7.0, 0.15, 6.5);
cylinder(0.03, 0.03, 0.3, 0x777777, -7.0, 0.15, 6.5);
cylinder(0.12, 0.12, 0.04, 0x555555, -7.0, 0.15, 6.8);
// Second dumbbell
cylinder(0.10, 0.10, 0.04, 0x555555, -6.5, 0.15, 6.5);
cylinder(0.03, 0.03, 0.25, 0x777777, -6.5, 0.15, 6.5);
cylinder(0.10, 0.10, 0.04, 0x555555, -6.5, 0.15, 6.75);

// Treadmill
box(0.7, 0.1, 1.5, 0x3a3a4a, -4.0, 0.3, 5.5); // base
box(0.5, 0.03, 1.3, 0x222222, -4.0, 0.36, 5.5); // belt
box(0.06, 0.8, 0.06, 0x555555, -3.6, 0.7, 4.8); // pole
box(0.3, 0.2, 0.06, 0x3a3a4a, -3.6, 1.0, 4.8); // panel

// ─── MEETING AREA ───
// Long table
box(3.0, 0.06, 1.2, 0xc4a882, 5.0, 0.75, 5.0);
box(0.06, 0.75, 0.06, 0x8b7355, 3.7, 0.375, 4.5);
box(0.06, 0.75, 0.06, 0x8b7355, 6.3, 0.375, 4.5);
box(0.06, 0.75, 0.06, 0x8b7355, 3.7, 0.375, 5.5);
box(0.06, 0.75, 0.06, 0x8b7355, 6.3, 0.375, 5.5);

// Meeting chairs (6)
const chairPositions = [
  [3.8, 4.2], [5.0, 4.2], [6.2, 4.2],

];
chairPositions.forEach(([x, z]) => {
  cylinder(0.18, 0.18, 0.05, 0x667788, x, 0.5, z);

});

// Whiteboard
box(2.4, 1.5, 0.06, 0xf5f5f5, 5.0, 1.5, 7.0);
box(2.5, 1.6, 0.03, 0x888888, 5.0, 1.5, 7.03);
// Some scribbles on whiteboard
box(1.8, 0.03, 0.02, 0x3366aa, 4.7, 1.8, 6.97);
box(0.8, 0.03, 0.02, 0xaa3333, 4.5, 1.5, 6.97);
box(1.2, 0.03, 0.02, 0x33aa66, 5.2, 1.2, 6.97);

// ─── DECORATIVE ELEMENTS ───
// Another plant (near meeting)
cylinder(0.18, 0.14, 0.4, 0x8b6b4a, 2.5, 0.2, 7.0);
sphere(0.4, 0x4a8a4a, 2.5, 0.8, 7.0);
sphere(0.3, 0x5a9a5a, 2.3, 1.0, 6.8);

// Small rug under coffee table
zoneFloor(4.5, -4.0, 2.0, 1.4, 0xd4c4a8);

// ─── AGENT CHARACTER CREATION ───
class AgentCharacter {
  constructor(data, index) {
    this.data = data;
    this.group = new THREE.Group();
    this.state = data.state;
    this.color = new THREE.Color(data.color);
    this.darkerColor = new THREE.Color(data.color).multiplyScalar(0.75);
    this.name = data.name;

    // Animation state
    this.walkTimer = Math.random() * Math.PI * 2;
    this.idleTimer = Math.random() * Math.PI * 2;
    this.target = null;
    this.startPos = null;
    this.walkProgress = 0;
    this.walkDuration = 2.5;
    this.nextWalkTime = Date.now() + 2000 + Math.random() * 5000;
    this.isWalking = false;
    this.facing = 0; // rotation Y
    this.sitting = false;

    if (data.state === 'offline') {
      this.group.visible = false;
    }

    this._buildCharacter();
    this._placeInZone(index);
    scene.add(this.group);
  }

  _buildCharacter() {
    const c = this.color;
    const dc = this.darkerColor;

    // Body (trapezoid: narrower top)
    const bodyGeo = new THREE.CylinderGeometry(0.18, 0.25, 0.5, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: dc, roughness: 0.7 });
    this.body = new THREE.Mesh(bodyGeo, bodyMat);
    this.body.position.y = 0.7;
    this.body.castShadow = true;
    this.group.add(this.body);

    // Head
    const headGeo = new THREE.SphereGeometry(0.28, 12, 8);
    const headMat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.65 });
    this.head = new THREE.Mesh(headGeo, headMat);
    this.head.position.y = 1.2;
    this.head.castShadow = true;
    this.group.add(this.head);

    // Eyes
    const eyeWhiteGeo = new THREE.SphereGeometry(0.07, 8, 6);
    const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const eyeBlackGeo = new THREE.SphereGeometry(0.04, 8, 6);
    const eyeBlackMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

    [-0.1, 0.1].forEach(xOff => {
      const eyeWhite = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
      eyeWhite.position.set(xOff, 1.22, 0.22);
      this.group.add(eyeWhite);
      const eyeBlack = new THREE.Mesh(eyeBlackGeo, eyeBlackMat);
      eyeBlack.position.set(xOff, 1.22, 0.26);
      this.group.add(eyeBlack);
    });

    // Arms - use pivot groups so rotation happens from shoulder
    const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6);
    const armMat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });

    this.leftArmPivot = new THREE.Group();
    this.leftArmPivot.position.set(-0.28, 0.92, 0);
    this.leftArm = new THREE.Mesh(armGeo, armMat);
    this.leftArm.position.y = -0.175;
    this.leftArm.castShadow = true;
    this.leftArmPivot.add(this.leftArm);
    this.group.add(this.leftArmPivot);

    this.rightArmPivot = new THREE.Group();
    this.rightArmPivot.position.set(0.28, 0.92, 0);
    this.rightArm = new THREE.Mesh(armGeo, armMat);
    this.rightArm.position.y = -0.175;
    this.rightArm.castShadow = true;
    this.rightArmPivot.add(this.rightArm);
    this.group.add(this.rightArmPivot);

    // Legs - use pivot groups so rotation happens from hip
    const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.35, 6);
    const legMat = new THREE.MeshStandardMaterial({ color: dc, roughness: 0.7 });

    this.leftLegPivot = new THREE.Group();
    this.leftLegPivot.position.set(-0.1, 0.42, 0);
    this.leftLeg = new THREE.Mesh(legGeo, legMat);
    this.leftLeg.position.y = -0.175;
    this.leftLeg.castShadow = true;
    this.leftLegPivot.add(this.leftLeg);
    this.group.add(this.leftLegPivot);

    this.rightLegPivot = new THREE.Group();
    this.rightLegPivot.position.set(0.1, 0.42, 0);
    this.rightLeg = new THREE.Mesh(legGeo, legMat);
    this.rightLeg.position.y = -0.175;
    this.rightLeg.castShadow = true;
    this.rightLegPivot.add(this.rightLeg);
    this.group.add(this.rightLegPivot);
  }

  _placeInZone(index) {
    if (this.state === 'offline') return;

    if (this.state === 'working') {
      // Find a free workstation chair
      const chairIdx = agents.filter((a,i) => i < index && a.state === 'working').length;
      const chairPos = zones.workstation.chairs[chairIdx] || zones.workstation.chairs[0];
      this.group.position.set(chairPos.x, 0, chairPos.z);
      this.sitting = true;
      this._setSittingPose();
    } else {
      // Place in assigned zone
      const zone = zones[this.data.zone] || zones.lounge;
      const wander = zone.wander || zone.chairs;
      if (wander && wander.length > 0) {
        const pos = wander[Math.floor(Math.random() * wander.length)];
        this.group.position.set(pos.x, 0, pos.z);
      } else {
        this.group.position.set(zone.center.x, 0, zone.center.z);
      }
    }
  }

  _setSittingPose() {
    this.body.position.y = 0.55;
    this.head.position.y = 1.05;
    this.leftLegPivot.position.set(-0.1, 0.3, 0.05);
    this.leftLegPivot.rotation.x = 0.5;
    this.rightLegPivot.position.set(0.1, 0.3, 0.05);
    this.rightLegPivot.rotation.x = 0.5;
    this.leftArmPivot.position.set(-0.28, 0.75, 0.05);
    this.rightArmPivot.position.set(0.28, 0.75, 0.05);
    this.leftArmPivot.rotation.x = -0.7;
    this.rightArmPivot.rotation.x = -0.7;
    // Face the monitor (+z direction)
    this.group.rotation.y = 0;
  }

  _setStandingPose() {
    this.body.position.y = 0.7;
    this.head.position.y = 1.2;
    this.leftLegPivot.position.set(-0.1, 0.42, 0);
    this.leftLegPivot.rotation.x = 0;
    this.rightLegPivot.position.set(0.1, 0.42, 0);
    this.rightLegPivot.rotation.x = 0;
    this.leftArmPivot.position.set(-0.28, 0.92, 0);
    this.rightArmPivot.position.set(0.28, 0.92, 0);
    this.leftArmPivot.rotation.x = 0;
    this.rightArmPivot.rotation.x = 0;
  }

  startWalkingTo(target) {
    if (this.state === 'working' || this.state === 'offline') return;
    this._setStandingPose();
    this.sitting = false;
    this.target = target.clone();
    this.startPos = this.group.position.clone();
    this.walkProgress = 0;
    this.isWalking = true;
    // Face direction
    const dx = target.x - this.startPos.x;
    const dz = target.z - this.startPos.z;
    this.facing = Math.atan2(dx, dz);
  }

  update(dt) {
    if (this.state === 'offline') return;

    if (this.state === 'working') {
      // Typing animation: slight body bob
      this.idleTimer += dt * 3;
      const bob = Math.sin(this.idleTimer) * 0.01;
      this.body.position.y = 0.55 + bob;
      this.head.position.y = 1.05 + bob;
      this.rightArmPivot.rotation.x = -0.7 + Math.sin(this.idleTimer * 2) * 0.15;
      return;
    }

    if (this.isWalking && this.target) {
      this.walkProgress += dt / this.walkDuration;
      if (this.walkProgress >= 1) {
        this.walkProgress = 1;
        this.isWalking = false;
        this.group.position.set(this.target.x, 0, this.target.z);
        this.nextWalkTime = Date.now() + 4000 + Math.random() * 6000;
        this.target = null;
      } else {
        const t = this.walkProgress;
        const smoothT = t * t * (3 - 2 * t); // smoothstep
        this.group.position.lerpVectors(this.startPos, this.target, smoothT);
      }

      // Walk animation
      this.walkTimer += dt * 8;
      const swing = Math.sin(this.walkTimer) * 0.4;
      this.leftLegPivot.rotation.x = swing;
      this.rightLegPivot.rotation.x = -swing;
      this.leftArmPivot.rotation.x = -swing * 0.6;
      this.rightArmPivot.rotation.x = swing * 0.6;
      // Body bounce
      const bounce = Math.abs(Math.sin(this.walkTimer)) * 0.04;
      this.body.position.y = 0.7 + bounce;
      this.head.position.y = 1.2 + bounce;

      // Face target
      this.group.rotation.y = this.facing;
    } else {
      // Idle swaying
      this.idleTimer += dt * 2;
      const sway = Math.sin(this.idleTimer) * 0.02;
      this.body.position.y = 0.7 + sway;
      this.head.position.y = 1.2 + sway;
      this.leftLegPivot.rotation.x = 0;
      this.rightLegPivot.rotation.x = 0;
      this.leftArmPivot.rotation.x = Math.sin(this.idleTimer * 0.7) * 0.05;
      this.rightArmPivot.rotation.x = -Math.sin(this.idleTimer * 0.7) * 0.05;

      // Check if time to walk to a new location
      if (Date.now() > this.nextWalkTime) {
        const newZone = allZones[Math.floor(Math.random() * allZones.length)];
        const zone = zones[newZone];
        const wander = zone.wander || [];
        if (wander.length > 0) {
          const dest = wander[Math.floor(Math.random() * wander.length)];
          this.startWalkingTo(dest);
        }
      }
    }
  }
}

// ─── CREATE AGENTS ───
const agentObjects = agents.map((a, i) => new AgentCharacter(a, i));

// ─── UI STATUS BAR ───
const agentList = document.getElementById('agentList');
agents.forEach(a => {
  const pill = document.createElement('div');
  pill.className = `agent-pill ${a.state === 'offline' ? 'offline' : ''}`;
  pill.innerHTML = `<span class="dot" style="background:${a.color}"></span>
    <span>${a.name}</span>
    <span class="status-text">${a.state}</span>`;
  agentList.appendChild(pill);
});

// ─── NAME LABELS ───
const labelContainer = document.getElementById('labelContainer');
const labelElements = [];
agents.forEach(a => {
  const el = document.createElement('div');
  el.className = 'agent-label';
  el.textContent = a.name;
  el.style.color = a.color;
  el.style.borderLeft = `3px solid ${a.color}`;
  if (a.state === 'offline') el.style.display = 'none';
  labelContainer.appendChild(el);
  labelElements.push(el);
});

function updateLabels() {
  const tempV = new THREE.Vector3();
  agentObjects.forEach((agent, i) => {
    if (!agent.group.visible) {
      labelElements[i].style.display = 'none';
      return;
    }
    labelElements[i].style.display = '';
    agent.group.getWorldPosition(tempV);
    tempV.y += 1.7;
    tempV.project(camera);
    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-tempV.y * 0.5 + 0.5) * window.innerHeight;
    labelElements[i].style.left = x + 'px';
    labelElements[i].style.top = y + 'px';
  });
}

// ─── ANIMATION LOOP ───
let lastTime = performance.now();
function animate(time) {
  requestAnimationFrame(animate);
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;

  agentObjects.forEach(a => a.update(dt));
  updateLabels();

  renderer.render(scene, camera);
}
animate(performance.now());

// ─── RESIZE ───
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  camera.left = -d * aspect;
  camera.right = d * aspect;
  camera.top = d;
  camera.bottom = -d;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
