<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lume Office</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: #f5f5f5; overflow: hidden; height: 100vh; }

/* Top bar */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
  padding: 10px 24px; display: flex; align-items: center; gap: 20px;
  border-bottom: 1px solid #eee;
}
.top-bar h1 { font-size: 16px; font-weight: 700; color: #1a1a1a; }
.top-bar h1 span { color: #10a37f; }

.agent-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.agent-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 12px;
  background: #f5f5f5; font-size: 11px; font-weight: 500; color: #555;
}
.agent-pill.offline { opacity: 0.35; }
.agent-pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.agent-pill .st { color: #aaa; font-size: 10px; }

/* 3D canvas */
canvas#c { display: block; width: 100vw; height: 100vh; }

/* Agent name labels (CSS2D) */
.label-wrap { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
.lbl {
  position: absolute; transform: translate(-50%, -120%);
  background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
  padding: 1px 7px 2px; border-radius: 6px;
  font-size: 10px; font-weight: 600; color: #333; white-space: nowrap;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  border: 1px solid rgba(0,0,0,0.05);
}
.lbl::after {
  content:''; position:absolute; bottom:-3px; left:50%; transform:translateX(-50%);
  border-left:3px solid transparent; border-right:3px solid transparent;
  border-top:3px solid rgba(255,255,255,0.92);
}

/* Zone labels */
.zone-lbl {
  position: absolute; transform: translate(-50%, -50%);
  font-size: 10px; font-weight: 600; color: #bbb;
  text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
}
</style>
</head>
<body>

<div class="top-bar">
  <h1><span>●</span> Lume Office</h1>
  <div class="agent-pills" id="pills"></div>
</div>
<div class="label-wrap" id="labels"></div>
<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ─── CONFIG ───
const AGENTS = [
  { name:'Lingxi', color:0x6366f1, state:'working',  zone:'workstation' },
  { name:'Spark',  color:0x10a37f, state:'working',  zone:'workstation' },
  { name:'Pulse',  color:0xf59e0b, state:'working',  zone:'workstation' },
  { name:'Nova',   color:0x8b5cf6, state:'idle',     zone:'lounge' },
  { name:'Scope',  color:0x06b6d4, state:'working',  zone:'workstation' },
  { name:'Echo',   color:0xef4444, state:'working',  zone:'workstation' },
  { name:'Prism',  color:0xec4899, state:'working',  zone:'workstation' },
  { name:'Nest',   color:0x3b82f6, state:'working',  zone:'workstation' },
];

// Zone centers (x, z) for navigation
// LEFT: top→bottom = lounge, fitness, meeting  |  RIGHT: workstations
const ZONES = {
  lounge:      { x: -5.5, z: -3.5 },
  fitness:     { x: -5.5, z: 2.5 },
  meeting:     { x: 0, z: 5 },
  workstation: { x: 4.5, z: 0 },
};

// Desk positions — RIGHT side, 2 per row, 4 rows = 8 desks
const DESKS = [
  { x: 3.5, z: -5 },   { x: 6, z: -5 },
  { x: 3.5, z: -1.7 }, { x: 6, z: -1.7 },
  { x: 3.5, z: 1.7 },  { x: 6, z: 1.7 },
  { x: 3.5, z: 5 },    { x: 6, z: 5 },
];

// ─── RENDERER ───
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ─── SCENE ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

// ─── CAMERA — Marvis-style elevated front view ───
// Look from front-top, office aligned with screen edges (no rotation)
const frustumSize = 16;
const aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect / 2, frustumSize * aspect / 2,
  frustumSize / 2, -frustumSize / 2,
  0.1, 200
);
camera.position.set(0, 24, 14);
camera.lookAt(0.5, 0, 0.5);

// ─── LIGHTS ───
// Soft ambient fill
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
// Main directional (sun-like)
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(8, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18; sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
sun.shadow.bias = -0.001;
scene.add(sun);
// Hemisphere for soft fill
scene.add(new THREE.HemisphereLight(0xffffff, 0xe0e0e0, 0.3));

// ─── MATERIALS ───
const mat = {
  floor:      new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.95 }),
  zone_ws:    new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.9 }),
  zone_l:     new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.9 }),
  zone_f:     new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.9 }),
  zone_m:     new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.9 }),
  white:      new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.4 }),
  desk:       new THREE.MeshStandardMaterial({ color: 0xf8f8f8, roughness: 0.3 }),
  deskEdge:   new THREE.MeshStandardMaterial({ color: 0xe2e2e2, roughness: 0.5 }),
  deskLeg:    new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 }),
  chair:      new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.6 }),
  chairBack:  new THREE.MeshStandardMaterial({ color: 0xbbbbbb, roughness: 0.6 }),
  monitor:    new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.15 }),
  screen:     new THREE.MeshStandardMaterial({ color: 0x1a1a2e, emissive: 0x4285F4, emissiveIntensity: 0.5, roughness: 0.1 }),
  screenOff:  new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 }),
  sofa:       new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.7 }),
  table:      new THREE.MeshStandardMaterial({ color: 0xeaeaea, roughness: 0.5 }),
  plant:      new THREE.MeshStandardMaterial({ color: 0x6b9b6b, roughness: 0.8 }),
  pot:        new THREE.MeshStandardMaterial({ color: 0x8B6914, roughness: 0.7 }),
  potLight:   new THREE.MeshStandardMaterial({ color: 0x9B7924, roughness: 0.7 }),
  yoga:       new THREE.MeshStandardMaterial({ color: 0xb8d4c8, roughness: 0.9 }),
  metal:      new THREE.MeshStandardMaterial({ color: 0xc0c0c0, roughness: 0.2, metalness: 0.6 }),
  board:      new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2 }),
  boardFrame: new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.3 }),
  coffee:     new THREE.MeshStandardMaterial({ color: 0xc0c0c0, roughness: 0.2, metalness: 0.5 }),
  treadmill:  new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.6 }),
  treadmillBelt: new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.9 }),
};

// ─── BUILDING HELPERS ───
function addBox(w, h, d, material, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
function addCyl(rT, rB, h, material, x, y, z, segs=12) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rT, rB, h, segs), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}
function addSphere(r, material, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

// ─── FLOOR ───
const floor = new THREE.Mesh(new THREE.PlaneGeometry(32, 22), mat.floor);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Zone patches
function addZone(x, z, w, d, material) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), material);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.005, z);
  m.receiveShadow = true;
  scene.add(m);
}
// Zone patches — LEFT column (lounge/fitness/meeting), RIGHT column (workstation)
addZone(-5.5, -3.5, 7, 7, mat.zone_l);   // Lounge (top-left)
addZone(-5.5, 2.5,  7, 6, mat.zone_f);   // Fitness (bottom-left)
addZone(0, 5,        5, 5, mat.zone_m);   // Meeting (bottom-center)
addZone(4.5, 0,      7, 14, mat.zone_ws); // Workstation (right column, full height)

// ─── WORKSTATION AREA ───
// 6 desks: 2 per row × 3 rows on RIGHT side
// Monitor on far side (z+), chair & character on near side (z-), facing monitor
const screenLights = [];
DESKS.forEach((pos, i) => {
  const { x, z } = pos;
  // Desk surface
  addBox(1.4, 0.05, 0.7, mat.desk, x, 0.74, z);
  // Desk legs (#ccc)
  [[-0.6,-0.28],[0.6,-0.28],[-0.6,0.28],[0.6,0.28]].forEach(([lx,lz]) =>
    addBox(0.04, 0.72, 0.04, mat.deskLeg, x+lx, 0.36, z+lz)
  );
  // Monitor on far side (small z = back, away from camera)
  addBox(0.9, 0.55, 0.03, mat.monitor, x, 1.08, z-0.26);
  const scrMat = i < 3 ? mat.screen : mat.screenOff;
  addBox(0.82, 0.48, 0.015, scrMat, x, 1.08, z-0.28);
  addBox(0.06, 0.22, 0.06, mat.monitor, x, 0.85, z-0.26);
  // Chair seat (#e8e8e8) on near side
  addCyl(0.22, 0.22, 0.06, mat.chair, x, 0.52, z+0.4, 16);
  // Chair back (#bbb)
  addBox(0.4, 0.35, 0.04, mat.chairBack, x, 0.72, z+0.6);
  addCyl(0.03, 0.03, 0.48, mat.metal, x, 0.24, z+0.4, 8);
  // Screen glow (in front of monitor)
  const sl = new THREE.PointLight(0x4488cc, 0.15, 2);
  sl.position.set(x, 1.1, z-0.1);
  scene.add(sl);
  screenLights.push(sl);
});

// ─── LOUNGE AREA (top-left) ───
// L-shaped sofa
addBox(2.4, 0.35, 0.8, mat.sofa, -5.5, 0.22, -5);
addBox(0.8, 0.35, 1.4, mat.sofa, -6.7, 0.22, -4);
addBox(2.4, 0.12, 0.7, mat.sofa, -5.5, 0.44, -5);
addBox(0.7, 0.12, 1.3, mat.sofa, -6.7, 0.44, -4);
// Back cushions
addBox(2.4, 0.3, 0.12, mat.sofa, -5.5, 0.62, -5.45);
addBox(0.12, 0.3, 1.4, mat.sofa, -7.15, 0.62, -4);
// Coffee table
addBox(1.0, 0.04, 0.55, mat.desk, -4.5, 0.38, -3.2);
addBox(0.04, 0.36, 0.04, mat.desk, -4.9, 0.19, -3.0);
addBox(0.04, 0.36, 0.04, mat.desk, -4.1, 0.19, -3.0);
addBox(0.04, 0.36, 0.04, mat.desk, -4.9, 0.19, -3.4);
addBox(0.04, 0.36, 0.04, mat.desk, -4.1, 0.19, -3.4);
// Coffee cups
addCyl(0.05, 0.04, 0.07, mat.white, -4.6, 0.44, -3.2, 10);
addCyl(0.05, 0.04, 0.07, mat.white, -4.4, 0.44, -3.1, 10);
// Plants
addCyl(0.18, 0.13, 0.28, mat.pot, -3.2, 0.14, -5.5);
addSphere(0.35, mat.plant, -3.2, 0.5, -5.5);
addCyl(0.12, 0.08, 0.2, mat.pot, -7.5, 0.1, -5.5);
addSphere(0.25, mat.plant, -7.5, 0.35, -5.5);
// Warm light
const loungeLight = new THREE.PointLight(0xffeedd, 0.3, 5);
loungeLight.position.set(-5, 2, -4);
scene.add(loungeLight);

// ─── FITNESS AREA (bottom-left) ───
// Yoga mats
addBox(0.7, 0.02, 1.4, mat.yoga, -5.5, 0.01, 2);
addBox(0.7, 0.02, 1.4, new THREE.MeshStandardMaterial({ color: 0xd4b8c8, roughness: 0.9 }), -4, 0.01, 2);
// Dumbbells
addCyl(0.05, 0.05, 0.35, mat.metal, -5, 0.07, 0.8, 8);
addSphere(0.08, mat.metal, -5, 0.07, 0.6);
addSphere(0.08, mat.metal, -5, 0.07, 1.0);
addCyl(0.05, 0.05, 0.25, mat.metal, -6, 0.07, 0.8, 8);
addSphere(0.06, mat.metal, -6, 0.07, 0.65);
addSphere(0.06, mat.metal, -6, 0.07, 0.95);
// Treadmill
addBox(0.55, 0.07, 1.2, mat.treadmill, -7, 0.26, 2.5);
addBox(0.45, 0.02, 1.1, mat.treadmillBelt, -7, 0.3, 2.5);
addBox(0.04, 0.7, 0.04, mat.treadmill, -7.3, 0.62, 3.0);
addBox(0.04, 0.7, 0.04, mat.treadmill, -6.7, 0.62, 3.0);
addBox(0.6, 0.04, 0.04, mat.treadmill, -7, 0.97, 3.0);
// Water bottle
addCyl(0.04, 0.04, 0.16, new THREE.MeshStandardMaterial({ color:0x6699cc, roughness:0.2 }), -3.5, 0.09, 3.2, 8);
// Punching bag
addCyl(0.15, 0.12, 0.5, mat.metal, -3.5, 0.8, 1, 8);

// ─── MEETING AREA (bottom-center) ───
// Long table
addBox(2.4, 0.05, 0.9, mat.desk, 0.5, 0.72, 5);
// Table legs
[[-1.0,-0.35],[1.0,-0.35],[-1.0,0.35],[1.0,0.35]].forEach(([lx,lz]) =>
  addBox(0.04, 0.7, 0.04, mat.deskLeg, 0.5+lx, 0.35, 5+lz)
);
// Chairs around table
[[-0.7,4.0],[0,4.0],[0.7,4.0],[-0.7,6.0],[0,6.0],[0.7,6.0]].forEach(([cx,cz]) => {
  addCyl(0.16, 0.16, 0.05, mat.chair, 0.5+cx, 0.46, cz, 14);
  addBox(0.28, 0.28, 0.03, mat.chair, 0.5+cx, 0.62, cz+0.16);
  addCyl(0.02, 0.02, 0.42, mat.metal, 0.5+cx, 0.21, cz, 8);
});
// Whiteboard
addBox(2.0, 1.2, 0.03, mat.board, 0.5, 1.4, 7.2);
addBox(2.1, 1.3, 0.02, mat.boardFrame, 0.5, 1.4, 7.18);
// Markers
addBox(0.4, 0.02, 0.01, new THREE.MeshStandardMaterial({ color:0x4285F4 }), 0.3, 1.6, 7.23);
addBox(0.25, 0.02, 0.01, new THREE.MeshStandardMaterial({ color:0xcc4444 }), 0.8, 1.3, 7.23);

// ─── CHARACTER BUILDER ───
class AgentCharacter {
  constructor(name, color, state, zone) {
    this.name = name;
    this.color = color;
    this.state = state;
    this.group = new THREE.Group();
    this.group.visible = state !== 'offline';
    this.walkTarget = null;
    this.walkSpeed = 1.8;
    this.idleTimer = 0;
    this.idleInterval = 5 + Math.random() * 8;
    this.bobPhase = Math.random() * Math.PI * 2;

    // Marvis-style: black body + colored scarf
    const matBody = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
    const matScarf = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
    const matEye = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });

    // Head (black)
    this.head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), matBody);
    this.head.position.y = 0.85;
    this.head.castShadow = true;
    this.group.add(this.head);

    // Eyes (white dots)
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), matEye);
    eyeL.position.set(-0.07, 0.88, 0.18);
    this.group.add(eyeL);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), matEye);
    eyeR.position.set(0.07, 0.88, 0.18);
    this.group.add(eyeR);

    // Scarf (colored ring around neck)
    const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.04, 6, 12), matScarf);
    scarf.position.y = 0.7;
    scarf.rotation.x = Math.PI / 2;
    this.group.add(scarf);

    // Body (black)
    this.body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.14, 0.18, 0.35, 8),
      matBody
    );
    this.body.position.y = 0.52;
    this.body.castShadow = true;
    this.group.add(this.body);

    // Arms (black)
    this.armL = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.22, 6), matBody);
    this.armL.position.set(-0.2, 0.55, 0);
    this.group.add(this.armL);

    this.armR = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.22, 6), matBody);
    this.armR.position.set(0.2, 0.55, 0);
    this.group.add(this.armR);

    // Legs (black)
    this.legL = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.25, 6), matBody);
    this.legL.position.set(-0.07, 0.14, 0);
    this.group.add(this.legL);

    this.legR = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.25, 6), matBody);
    this.legR.position.set(0.07, 0.14, 0);
    this.group.add(this.legR);

    // Place at initial zone
    const zonePos = ZONES[zone] || { x: 0, z: 0 };
    const offset = (Math.random() - 0.5) * 2;
    this.group.position.set(zonePos.x + offset, 0, zonePos.z + offset);

    if (state === 'working') {
      this.sitAtDesk();
    }

    scene.add(this.group);
  }

  sitAtDesk() {
    // Assign desk index based on agent order
    if (this._deskIdx === undefined) {
      const workingAgents = AGENTS.filter(a => a.state === 'working');
      const myIndex = workingAgents.findIndex(a => a.name === this.name);
      this._deskIdx = myIndex >= 0 ? myIndex : 0;
    }
    const desk = DESKS[this._deskIdx] || DESKS[0];
    // Character sits at chair position (near side of desk, z+)
    this.group.position.set(desk.x, -0.15, desk.z + 0.3);
    // Face the monitor (face towards negative z)
    this.group.rotation.y = Math.PI;
    this.state = 'working';
  }

  walkTo(x, z) {
    this.walkTarget = new THREE.Vector3(x, 0, z);
    // Face direction
    const dx = x - this.group.position.x;
    const dz = z - this.group.position.z;
    if (Math.abs(dx) > 0.1 || Math.abs(dz) > 0.1) {
      this.group.rotation.y = Math.atan2(dx, dz);
    }
  }

  update(dt) {
    if (!this.group.visible) return;

    const t = performance.now() / 1000;

    if (this.walkTarget) {
      const pos = this.group.position;
      const dir = new THREE.Vector3().subVectors(this.walkTarget, pos);
      dir.y = 0;
      const dist = dir.length();
      if (dist < 0.15) {
        this.walkTarget = null;
        this.state = 'idle';
      } else {
        dir.normalize();
        pos.x += dir.x * this.walkSpeed * dt;
        pos.z += dir.z * this.walkSpeed * dt;
        // Face walk direction
        this.group.rotation.y = Math.atan2(dir.x, dir.z);
        // Walk animation — legs swing, arms swing, body bob
        const swing = Math.sin(t * 8) * 0.4;
        this.legL.rotation.x = swing;
        this.legR.rotation.x = -swing;
        this.armL.rotation.x = -swing * 0.6;
        this.armR.rotation.x = swing * 0.6;
        this.group.position.y = Math.abs(Math.sin(t * 8)) * 0.04;
        return;
      }
    }

    // Working animation — subtle typing
    if (this.state === 'working') {
      this.body.rotation.z = Math.sin(t * 2 + this.bobPhase) * 0.02;
      this.armL.rotation.x = -0.3 + Math.sin(t * 6) * 0.08;
      this.armR.rotation.x = -0.3 + Math.sin(t * 6 + 1) * 0.08;
      this.legL.rotation.x = 0;
      this.legR.rotation.x = 0;
      this.group.position.y = -0.2;
      return;
    }

    // Idle animation — gentle sway
    this.body.rotation.z = Math.sin(t * 1.5 + this.bobPhase) * 0.03;
    this.group.position.y = Math.sin(t * 2 + this.bobPhase) * 0.02;
    this.armL.rotation.x = Math.sin(t * 1.2 + this.bobPhase) * 0.1;
    this.armR.rotation.x = Math.sin(t * 1.2 + this.bobPhase + 1) * 0.1;
    this.legL.rotation.x = 0;
    this.legR.rotation.x = 0;

    // Random walk for idle agents
    this.idleTimer += dt;
    if (this.idleTimer > this.idleInterval) {
      this.idleTimer = 0;
      this.idleInterval = 5 + Math.random() * 8;
      const zoneKeys = Object.keys(ZONES).filter(k => k !== 'workstation');
      const zone = ZONES[zoneKeys[Math.floor(Math.random() * zoneKeys.length)]];
      const rx = zone.x + (Math.random() - 0.5) * 3;
      const rz = zone.z + (Math.random() - 0.5) * 3;
      this.walkTo(rx, rz);
    }
  }
}

// ─── CREATE AGENTS ───
const agentObjects = AGENTS.map(a => new AgentCharacter(a.name, a.color, a.state, a.zone));

// ─── TOP BAR PILLS ───
const pillsEl = document.getElementById('pills');
AGENTS.forEach(a => {
  const hex = '#' + new THREE.Color(a.color).getHexString();
  const pill = document.createElement('div');
  pill.className = 'agent-pill' + (a.state === 'offline' ? ' offline' : '');
  pill.innerHTML = `<span class="dot" style="background:${hex}"></span>${a.name}<span class="st">${a.state}</span>`;
  pillsEl.appendChild(pill);
});

// ─── LABELS ───
const labelsEl = document.getElementById('labels');
const labelDivs = agentObjects.map(a => {
  const div = document.createElement('div');
  div.className = 'lbl';
  const hex = '#' + new THREE.Color(a.color).getHexString();
  div.innerHTML = `<span style="color:${hex}">●</span> ${a.name}`;
  labelsEl.appendChild(div);
  return div;
});

function updateLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  agentObjects.forEach((agent, i) => {
    if (!agent.group.visible) {
      labelDivs[i].style.display = 'none';
      return;
    }
    const pos = new THREE.Vector3();
    agent.head.getWorldPosition(pos);
    pos.y += 0.3;
    pos.project(camera);
    const x = (pos.x * 0.5 + 0.5) * w;
    const y = (-pos.y * 0.5 + 0.5) * h;
    labelDivs[i].style.display = '';
    labelDivs[i].style.left = x + 'px';
    labelDivs[i].style.top = y + 'px';
  });
}

// ─── ANIMATE ───
let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  agentObjects.forEach(a => a.update(dt));
  updateLabels();

  renderer.render(scene, camera);
}
animate(performance.now());

// ─── RESIZE ───
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  const a = w / h;
  camera.left = -frustumSize * a / 2;
  camera.right = frustumSize * a / 2;
  camera.top = frustumSize / 2;
  camera.bottom = -frustumSize / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
