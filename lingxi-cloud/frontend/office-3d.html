<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lume Office</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f0f0; overflow: hidden; height: 100vh; user-select: none; }

/* Status bar */
#status-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 44px;
  background: rgba(30,30,30,0.78); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center; gap: 12px;
  z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1);
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 0 8px;
  flex-wrap: nowrap;
}
.status-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: #ddd;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
.status-scarf { width: 14px; height: 5px; border-radius: 2px; }
.status-chip {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: rgba(255,255,255,0.12); color: #ccc;
}

/* Toast */
#toast {
  position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
  background: rgba(30,30,30,0.88); backdrop-filter: blur(8px);
  color: #fff; padding: 8px 20px; border-radius: 20px;
  font-size: 13px; z-index: 200; pointer-events: none;
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

canvas { display: block; }
</style>
</head>
<body>

<div id="status-bar"></div>
<div id="toast"></div>
<canvas id="canvas"></canvas>

<script src="assets/js/office-engine.js?v=20260627d"></script>
<script>
// Standalone office page — uses the same engine as agent-workspace
const canvas = document.getElementById('canvas');
const office = initOffice(canvas, {
  // No onAgentClick → standalone mode with celebration + toast
  showToast: function(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  },
});
</script>
</body>
</html>
