<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lume Office</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f0f0; overflow: hidden; height: 100vh; user-select: none; }

/* Status bar */
#status-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 44px;
  background: rgba(30,30,30,0.78); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center; gap: 24px;
  z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1);
}
.status-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: #ddd;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
.status-scarf { width: 14px; height: 5px; border-radius: 2px; }
.status-chip {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: rgba(255,255,255,0.12); color: #ccc;
}

/* Toast */
#toast {
  position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
  background: rgba(30,30,30,0.88); backdrop-filter: blur(8px);
  color: #fff; padding: 8px 20px; border-radius: 20px;
  font-size: 13px; z-index: 200; pointer-events: none;
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

canvas { display: block; }
</style>
</head>
<body>

<div id="status-bar"></div>
<div id="toast"></div>
<canvas id="canvas"></canvas>

<script>
// ==================== CONFIG ====================
const CW = window.innerWidth, CH = window.innerHeight;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = CW; canvas.height = CH;

const STATES = { IDLE: 'idle', TYPING: 'typing', WALKING: 'walking', SLEEPING: 'sleeping' };
const STATE_COLORS = { idle: '#F1C40F', typing: '#2ECC71', walking: '#3498DB', sleeping: '#9B59B6' };
const STATE_LABELS = { idle: 'Idle', typing: 'Typing', walking: 'Walking', sleeping: 'Sleeping' };

const AGENTS = [
  { id:'lingxi', name:'Lingxi',  scarf:'#6366f1', deskIdx:0 },
  { id:'spark',  name:'Spark',   scarf:'#10a37f', deskIdx:1 },
  { id:'pulse',  name:'Pulse',   scarf:'#f59e0b', deskIdx:2 },
  { id:'nova',   name:'Nova',    scarf:'#8b5cf6', deskIdx:3 },
  { id:'scope',  name:'Scope',   scarf:'#06b6d4', deskIdx:4 },
  { id:'echo',   name:'Echo',    scarf:'#ef4444', deskIdx:5 },
  { id:'prism',  name:'Prism',   scarf:'#ec4899', deskIdx:6 },
  { id:'nest',   name:'Nest',    scarf:'#3b82f6', deskIdx:7 },
];

// Scale factor
const S = Math.min(CW / 1200, CH / 800);

// ==================== CAMERA ====================
const cam = { ox: CW/2, oy: CH/2, scale: 1, target: 1 };

// World → screen (top-down, with camera pan)
function W(wx, wy) {
  return { x: cam.ox + wx * S * cam.scale, y: cam.oy + wy * S * cam.scale };
}
function WS(v) { return v * S * cam.scale; }

// 6 workstations (like Marvis: 2 rows × 3 columns)
// 8 workstations (4 rows × 2 columns)
const DESKS = [
  { x:420, y:140 }, { x:620, y:140 },
  { x:420, y:320 }, { x:620, y:320 },
  { x:420, y:500 }, { x:620, y:500 },
  { x:420, y:680 }, { x:620, y:680 },
];

// Special locations
const LOC = {
  coffee:    { x:140, y:130 },
  sofa:      { x:130, y:640 },
  treadmill: { x:140, y:360 },
};

// ==================== HELPERS ====================
function lerp(a,b,t) { return a+(b-a)*t; }
function dist(x1,y1,x2,y2) { return Math.hypot(x2-x1,y2-y1); }
function rand(a,b) { return Math.random()*(b-a)+a; }

function rrect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function shadow(x,y,w,h,a=0.1) {
  ctx.fillStyle = `rgba(0,0,0,${a})`;
  ctx.beginPath();
  ctx.ellipse(x, y+2, w/2, h/3, 0, 0, Math.PI*2);
  ctx.fill();
}

// ==================== DRAW FUNCTIONS ====================

function drawZones() {
  // Break area
  ctx.fillStyle = 'rgba(139,105,20,0.03)';
  rrect(45,45,210,110,12); ctx.fill();
  // Wellness
  ctx.fillStyle = 'rgba(100,180,100,0.03)';
  rrect(45,285,210,95,12); ctx.fill();
  // Relax
  ctx.fillStyle = 'rgba(155,89,182,0.03)';
  rrect(45,560,210,105,12); ctx.fill();
  // Work zone
  ctx.fillStyle = 'rgba(66,133,244,0.02)';
  rrect(300,50,460,750,16); ctx.fill();
}

function drawLabels() {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.font = `${WS(11)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  const p = (x,y) => W(x,y);
  ctx.fillText('Break Area', p(150,135).x, p(150,135).y);
  ctx.fillText('Wellness Zone', p(140,375).x, p(140,375).y);
  ctx.fillText('Relax Zone', p(130,670).x, p(130,670).y);
  ctx.fillText('Work Zone', p(530,410).x, p(530,410).y);
}

function drawDesk(dx, dy) {
  const p = W(dx, dy);
  const dw = WS(150), dh = WS(100), r = WS(10);
  const sideH = WS(8); // visible desk thickness from above

  shadow(p.x, p.y+sideH/2, dw, dh, 0.1);

  // Right side (depth)
  ctx.fillStyle = '#e2e2e2';
  ctx.beginPath();
  ctx.moveTo(p.x+dw/2, p.y-dh/2);
  ctx.lineTo(p.x+dw/2, p.y+dh/2);
  ctx.lineTo(p.x+dw/2, p.y+dh/2+sideH);
  ctx.lineTo(p.x-dw/2, p.y+dh/2+sideH);
  ctx.lineTo(p.x-dw/2, p.y+dh/2);
  ctx.closePath();
  ctx.fill();

  // Bottom side (depth)
  ctx.fillStyle = '#ebebeb';
  ctx.beginPath();
  ctx.moveTo(p.x-dw/2, p.y+dh/2);
  ctx.lineTo(p.x+dw/2, p.y+dh/2);
  ctx.lineTo(p.x+dw/2, p.y+dh/2+sideH);
  ctx.lineTo(p.x-dw/2, p.y+dh/2+sideH);
  ctx.closePath();
  ctx.fill();

  // Desk surface (top)
  ctx.fillStyle = '#fafafa';
  rrect(p.x-dw/2, p.y-dh/2, dw, dh, r);
  ctx.fill();
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = WS(1.2);
  ctx.stroke();

  // Highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = WS(1);
  ctx.beginPath();
  ctx.moveTo(p.x-dw/2+r, p.y-dh/2+1);
  ctx.lineTo(p.x+dw/2-r, p.y-dh/2+1);
  ctx.stroke();
}

function drawMonitor(mx, my, active) {
  const p = W(mx, my);
  const mw = WS(50), mh = WS(32), mr = WS(4);
  const depth = WS(4); // monitor thickness

  // Stand
  ctx.fillStyle = '#c8c8c8';
  rrect(p.x-WS(14), p.y+mh/2-WS(2)+depth, WS(28), WS(8), WS(3)); ctx.fill();

  // Pole
  ctx.fillStyle = '#b0b0b0';
  ctx.fillRect(p.x-WS(2), p.y+mh/2, WS(4), depth);

  // Monitor back (visible top edge — slightly lighter)
  ctx.fillStyle = '#333';
  rrect(p.x-mw/2, p.y-mh/2, mw, depth, mr); ctx.fill();

  // Monitor body (front face)
  ctx.fillStyle = '#2a2a2a';
  rrect(p.x-mw/2, p.y-mh/2+depth, mw, mh, mr); ctx.fill();

  // Screen
  if (active) {
    ctx.save();
    ctx.shadowColor = 'rgba(66,133,244,0.5)';
    ctx.shadowBlur = WS(8);
    ctx.fillStyle = '#4285F4';
    rrect(p.x-mw/2+WS(3), p.y-mh/2+depth+WS(3), mw-WS(6), mh-WS(6), mr-WS(1)); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i=0;i<3;i++) ctx.fillRect(p.x-mw/2+WS(8), p.y-mh/2+depth+WS(8)+i*WS(7), WS(15), WS(2));
  } else {
    ctx.fillStyle = '#1a1a1a';
    rrect(p.x-mw/2+WS(3), p.y-mh/2+depth+WS(3), mw-WS(6), mh-WS(6), mr-WS(1)); ctx.fill();
  }
}

function drawChair(cx, cy) {
  const p = W(cx, cy);
  const cr = WS(18);

  shadow(p.x, p.y+WS(3), cr*2, cr*2, 0.1);

  // 5-star base
  ctx.strokeStyle = '#b8b8b8'; ctx.lineWidth = WS(1.5);
  for (let i=0;i<5;i++) {
    const a = (i/5)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+Math.cos(a)*cr*1.2, p.y+Math.sin(a)*cr*1.2); ctx.stroke();
  }
  ctx.fillStyle = '#999'; ctx.beginPath(); ctx.arc(p.x, p.y, WS(4), 0, Math.PI*2); ctx.fill();

  // Seat cushion (top view, with slight depth)
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, cr, cr*0.8, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = WS(0.8); ctx.stroke();

  // Backrest (visible as arc at top)
  ctx.fillStyle = '#dcdcdc';
  ctx.beginPath(); ctx.arc(p.x, p.y-cr*0.65, cr*0.7, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#c8c8c8'; ctx.lineWidth = WS(0.6); ctx.stroke();
}

function drawBreakArea() {
  const bx=60, by=70, bw=180, bh=55;
  const p = W(bx+bw/2, by+bh/2);
  const pw = WS(bw), ph = WS(bh);
  const sx = W(bx, by);
  const depth = WS(12); // cabinet height visible from top

  shadow(p.x, p.y+depth/2, pw, ph, 0.08);

  // Cabinet right side (depth)
  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.moveTo(sx.x+pw, sx.y);
  ctx.lineTo(sx.x+pw, sx.y+ph);
  ctx.lineTo(sx.x+pw, sx.y+ph+depth);
  ctx.lineTo(sx.x, sx.y+ph+depth);
  ctx.lineTo(sx.x, sx.y+ph);
  ctx.closePath(); ctx.fill();

  // Cabinet front side (depth)
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath();
  ctx.moveTo(sx.x, sx.y+ph);
  ctx.lineTo(sx.x+pw, sx.y+ph);
  ctx.lineTo(sx.x+pw, sx.y+ph+depth);
  ctx.lineTo(sx.x, sx.y+ph+depth);
  ctx.closePath(); ctx.fill();

  // Cabinet top surface
  ctx.fillStyle = '#f8f8f8';
  rrect(sx.x, sx.y, pw, ph, WS(8)); ctx.fill();
  ctx.strokeStyle = '#e2e2e2'; ctx.lineWidth = WS(1); ctx.stroke();

  // Drawers (front face details)
  ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = WS(0.5);
  ctx.beginPath(); ctx.moveTo(sx.x+WS(10), sx.y+ph+depth*0.5); ctx.lineTo(sx.x+pw-WS(10), sx.y+ph+depth*0.5); ctx.stroke();
  // Drawer knobs
  ctx.fillStyle = '#bbb';
  ctx.beginPath(); ctx.arc(sx.x+pw/2-WS(15), sx.y+ph+depth*0.5, WS(2), 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx.x+pw/2+WS(15), sx.y+ph+depth*0.5, WS(2), 0, Math.PI*2); ctx.fill();

  // Coffee machine (3D box on top)
  const cmx = W(bx+bw-40, by+bh/2);
  const cmw = WS(28), cmh = WS(32), cmd = WS(10);
  // Coffee machine side
  ctx.fillStyle = '#aaa';
  ctx.fillRect(cmx.x-cmw/2+cmw, cmx.y-cmh/2, cmd, cmh);
  // Coffee machine front
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(cmx.x-cmw/2, cmx.y-cmh/2+cmd, cmw, cmh-cmd);
  // Coffee machine top
  rrect(cmx.x-cmw/2, cmx.y-cmh/2, cmw, cmd, WS(4)); ctx.fill();
  ctx.strokeStyle = '#aaa'; ctx.lineWidth = WS(0.8); ctx.stroke();
  // Details
  ctx.fillStyle = '#999'; ctx.fillRect(cmx.x-WS(3), cmx.y-cmh/2+cmd+WS(2), WS(6), WS(5));
  ctx.fillStyle = '#E74C3C'; ctx.beginPath(); ctx.arc(cmx.x, cmx.y-cmh/2+cmd+WS(18), WS(3), 0, Math.PI*2); ctx.fill();

  // Cups (3D trapezoids with depth)
  for (let row=0;row<2;row++) for (let col=0;col<4;col++) {
    const cx = W(bx+28+col*28, by+16+row*24);
    const cupD = WS(4);
    // Cup side
    ctx.fillStyle = '#6B4F12';
    ctx.beginPath();
    ctx.moveTo(cx.x+WS(3), cx.y+WS(8));
    ctx.lineTo(cx.x+WS(3), cx.y+WS(8)+cupD);
    ctx.lineTo(cx.x-WS(3), cx.y+WS(8)+cupD);
    ctx.lineTo(cx.x-WS(3), cx.y+WS(8));
    ctx.closePath(); ctx.fill();
    // Cup top
    ctx.fillStyle = '#8B6914';
    ctx.beginPath();
    ctx.moveTo(cx.x-WS(5), cx.y-WS(2));
    ctx.lineTo(cx.x+WS(5), cx.y-WS(2));
    ctx.lineTo(cx.x+WS(3), cx.y+WS(8));
    ctx.lineTo(cx.x-WS(3), cx.y+WS(8));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6B4F12'; ctx.lineWidth = WS(0.6); ctx.stroke();
  }
}

function drawTreadmill() {
  const tx=70, ty=310, tw=140, th=55;
  const sx = W(tx, ty);
  const pw = WS(tw), ph = WS(th);
  const cx = W(tx+tw/2, ty+th/2);
  const depth = WS(10);

  shadow(cx.x, cx.y+depth/2, pw, ph, 0.08);

  // Base right side
  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.moveTo(sx.x+pw, sx.y+WS(8));
  ctx.lineTo(sx.x+pw, sx.y+ph-WS(12));
  ctx.lineTo(sx.x+pw, sx.y+ph-WS(12)+depth);
  ctx.lineTo(sx.x, sx.y+ph-WS(12)+depth);
  ctx.lineTo(sx.x, sx.y+ph-WS(12));
  ctx.closePath(); ctx.fill();

  // Base front side
  ctx.fillStyle = '#e5e5e5';
  ctx.beginPath();
  ctx.moveTo(sx.x, sx.y+ph-WS(12));
  ctx.lineTo(sx.x+pw, sx.y+ph-WS(12));
  ctx.lineTo(sx.x+pw, sx.y+ph-WS(12)+depth);
  ctx.lineTo(sx.x, sx.y+ph-WS(12)+depth);
  ctx.closePath(); ctx.fill();

  // Base top
  ctx.fillStyle = '#fafafa';
  rrect(sx.x, sx.y+WS(8), pw, ph-WS(12), WS(6)); ctx.fill();
  ctx.strokeStyle = '#e5e5e5'; ctx.lineWidth = WS(1); ctx.stroke();

  // Belt (dark inset on top)
  ctx.fillStyle = '#555';
  rrect(sx.x+WS(8), sx.y+WS(14), pw-WS(16), ph-WS(24), WS(3)); ctx.fill();

  // Belt lines
  ctx.strokeStyle = '#444'; ctx.lineWidth = WS(0.5);
  for (let i=tx+16;i<tx+tw-16;i+=10) {
    const lp = W(i, ty);
    ctx.beginPath(); ctx.moveTo(lp.x, sx.y+WS(16)); ctx.lineTo(lp.x, sx.y+ph-WS(16)); ctx.stroke();
  }

  // Handlebar posts (vertical, 3D)
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = WS(3); ctx.lineCap = 'round';
  const posts = [
    { x: tx+15, y1: ty+8, y2: ty-15 },
    { x: tx+tw-15, y1: ty+8, y2: ty-15 },
  ];
  posts.forEach(post => {
    const bot = W(post.x, post.y1);
    const top = W(post.x, post.y2);
    ctx.beginPath(); ctx.moveTo(bot.x, bot.y); ctx.lineTo(top.x, top.y); ctx.stroke();
  });

  // Handlebar (horizontal bar connecting posts at top)
  const hl = W(tx+15, ty-15);
  const hr = W(tx+tw-15, ty-15);
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = WS(3);
  ctx.beginPath(); ctx.moveTo(hl.x, hl.y); ctx.lineTo(hr.x, hr.y); ctx.stroke();

  // Control panel (3D box on handlebar center)
  const pc = W(tx+tw/2, ty-10);
  ctx.fillStyle = '#555';
  rrect(pc.x-WS(10), pc.y-WS(4), WS(20), WS(8), WS(3)); ctx.fill();
  ctx.fillStyle = '#444';
  rrect(pc.x-WS(10), pc.y-WS(4), WS(20), WS(4), WS(3)); ctx.fill();
  ctx.fillStyle = '#2ECC71'; ctx.beginPath(); ctx.arc(pc.x, pc.y-WS(1), WS(2), 0, Math.PI*2); ctx.fill();
}

function drawSofa() {
  const sx=70, sy=580, sw=120, sh=60;
  const p = W(sx+sw/2, sy+sh/2);
  const pw = WS(sw), ph = WS(sh);
  const start = W(sx, sy);
  const depth = WS(14);

  shadow(p.x, p.y+depth/2, pw, ph, 0.1);

  // Sofa right side (depth)
  ctx.fillStyle = '#d5d5d5';
  ctx.beginPath();
  ctx.moveTo(start.x+pw, start.y);
  ctx.lineTo(start.x+pw, start.y+ph);
  ctx.lineTo(start.x+pw, start.y+ph+depth);
  ctx.lineTo(start.x, start.y+ph+depth);
  ctx.lineTo(start.x, start.y+ph);
  ctx.closePath(); ctx.fill();

  // Sofa front side (depth)
  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.moveTo(start.x, start.y+ph);
  ctx.lineTo(start.x+pw, start.y+ph);
  ctx.lineTo(start.x+pw, start.y+ph+depth);
  ctx.lineTo(start.x, start.y+ph+depth);
  ctx.closePath(); ctx.fill();

  // Sofa top surface
  ctx.fillStyle = '#f5f5f5';
  rrect(start.x, start.y, pw, ph, WS(10)); ctx.fill();
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = WS(1); ctx.stroke();

  // Backrest (raised cushion on top)
  const bkH = WS(18);
  ctx.fillStyle = '#ebebeb';
  rrect(start.x+WS(5), start.y-WS(2), pw-WS(10), bkH, WS(6)); ctx.fill();
  ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = WS(0.8); ctx.stroke();

  // Backrest depth (right side)
  ctx.fillStyle = '#ccc';
  ctx.beginPath();
  ctx.moveTo(start.x+pw-WS(5), start.y-WS(2));
  ctx.lineTo(start.x+pw-WS(5), start.y-WS(2)+bkH);
  ctx.lineTo(start.x+pw-WS(5)+WS(4), start.y-WS(2)+bkH+WS(3));
  ctx.lineTo(start.x+pw-WS(5)+WS(4), start.y-WS(2)+WS(3));
  ctx.closePath(); ctx.fill();

  // Arms (raised sides with depth)
  ctx.fillStyle = '#eaeaea';
  rrect(start.x-WS(5), start.y+WS(8), WS(12), ph-WS(20), WS(5)); ctx.fill();
  rrect(start.x+pw-WS(7), start.y+WS(8), WS(12), ph-WS(20), WS(5)); ctx.fill();

  // Cushion line
  ctx.strokeStyle = '#e5e5e5'; ctx.lineWidth = WS(0.5);
  ctx.beginPath(); ctx.moveTo(start.x+pw/2, start.y+WS(15)); ctx.lineTo(start.x+pw/2, start.y+ph-WS(10)); ctx.stroke();

  // Side table (3D)
  const tp = W(sx+sw+18, sy+sh/2);
  const tDepth = WS(8);
  // Table side
  ctx.fillStyle = '#ddd';
  ctx.fillRect(tp.x-WS(12), tp.y-WS(12)+tDepth, WS(24)+WS(3), tDepth);
  // Table top
  ctx.fillStyle = '#f8f8f8';
  rrect(tp.x-WS(12), tp.y-WS(12), WS(24), WS(24), WS(5)); ctx.fill();
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = WS(0.8); ctx.stroke();
}

// ==================== CHARACTER ====================
class Char {
  constructor(agent, initState) {
    this.agent = agent;
    this.scarf = agent.scarf;
    this.state = initState;
    const d = DESKS[agent.deskIdx % DESKS.length];
    this.x = d.x; this.y = d.y + 55; // start at chair position
    this.tx = this.x; this.ty = this.y;
    this.anim = 0;
    this.stateTimer = rand(5,15);
    this.taskTimer = 0;
    this.speed = 3.5;
    this.angle = 0;
    this._next = null;
  }

  get homeDesk() {
    const d = DESKS[this.agent.deskIdx % DESKS.length];
    return { x: d.x, y: d.y + 55 };
  }

  update(dt) {
    this.anim += dt;

    if (this.taskTimer > 0) {
      this.taskTimer -= dt;
      if (this.taskTimer <= 0 && this.state === STATES.TYPING) this.setState(STATES.IDLE);
    }

    if (this.state === STATES.WALKING) {
      const d = dist(this.x, this.y, this.tx, this.ty);
      if (d < 2) {
        this.x = this.tx; this.y = this.ty;
        if (this._next) { this.setState(this._next); this._next = null; }
      } else {
        const dx = this.tx-this.x, dy = this.ty-this.y;
        const len = Math.hypot(dx,dy);
        this.x += dx/len * Math.min(this.speed, len);
        this.y += dy/len * Math.min(this.speed, len);
        this.angle = Math.atan2(dy, dx);
      }
    }

    if (this.state !== STATES.WALKING && this.taskTimer <= 0) {
      this.stateTimer -= dt;
      if (this.stateTimer <= 0) { this.autoSwitch(); this.stateTimer = rand(5,15); }
    }
  }

  setState(s) {
    this.state = s; this.anim = 0; this.updateUI();
    if (s===STATES.TYPING) this.stateTimer = rand(5,10);
    else if (s===STATES.IDLE) this.stateTimer = rand(4,8);
    else if (s===STATES.SLEEPING) this.stateTimer = rand(6,12);
  }

  walkTo(tx,ty,next) { this.tx=tx; this.ty=ty; this._next=next; this.setState(STATES.WALKING); }

  autoSwitch() {
    const r = Math.random();
    switch(this.state) {
      case STATES.IDLE:
        if (r<0.7) this.setState(STATES.TYPING);
        else { const d=r<0.85?LOC.coffee:LOC.sofa; this.walkTo(d.x,d.y,r<0.85?STATES.IDLE:STATES.SLEEPING); }
        break;
      case STATES.TYPING:
        if (r<0.55) this.setState(STATES.IDLE);
        else if (r<0.8) this.walkTo(LOC.coffee.x,LOC.coffee.y,STATES.IDLE);
        else this.walkTo(LOC.sofa.x,LOC.sofa.y,STATES.SLEEPING);
        break;
      case STATES.SLEEPING:
        if (r<0.8) { const h=this.homeDesk; this.walkTo(h.x,h.y,STATES.TYPING); }
        else this.setState(STATES.SLEEPING);
        break;
    }
  }

  updateUI() {
    const el = document.getElementById('st-'+this.agent.id);
    if (!el) return;
    const dot = el.querySelector('.status-dot');
    const chip = el.querySelector('.status-chip');
    const c = STATE_COLORS[this.state];
    dot.style.background = c; dot.style.color = c;
    chip.textContent = STATE_LABELS[this.state];
  }
}

// Create characters — mostly typing, 1-2 idle/outside
const chars = AGENTS.map((a, i) => {
  const state = i === 3 ? STATES.IDLE : (i === 6 ? STATES.SLEEPING : STATES.TYPING);
  const ch = new Char(a, state);
  if (state === STATES.IDLE) { ch.x = LOC.coffee.x; ch.y = LOC.coffee.y; }
  if (state === STATES.SLEEPING) { ch.x = LOC.sofa.x; ch.y = LOC.sofa.y; }
  return ch;
});

// ==================== DRAW CHARACTER ====================
function drawChar(ch) {
  const p = W(ch.x, ch.y);
  let ox=0, oy=0, bodySY=1, rot=0;

  if (ch.state===STATES.IDLE) {
    oy = Math.sin(ch.anim*3)*3*S;
    ox = Math.sin(ch.anim*2)*1.5*S;
  } else if (ch.state===STATES.WALKING) {
    oy = Math.abs(Math.sin(ch.anim*10))*3*S;
    rot = ch.angle;
  } else if (ch.state===STATES.SLEEPING) {
    rot = Math.PI/4;
    bodySY = 0.55;
    oy = Math.sin(ch.anim*1.5)*2*S;
    ox = -8*S;
  }

  ctx.save();
  ctx.translate(p.x+ox, p.y+oy);
  ctx.rotate(rot);

  const s = S * 1.4; // 40% bigger

  // === Lume Character: Marvis极简风纯黑剪影 + 彩色腰带 ===
  // 扁平化矢量风格，无渐变无阴影，圆润无尖角

  // Legs (chunky blocks)
  ctx.fillStyle = '#1a1a1a';
  const legOff = ch.state===STATES.WALKING ? Math.sin(ch.anim*10)*5*s : 0;
  // Left leg
  rrect(-10*s, 6*s, 6*s, 16*s+legOff, 3*s); ctx.fill();
  // Right leg
  rrect(4*s, 6*s, 6*s, 16*s-legOff, 3*s); ctx.fill();

  // Body (large rounded rectangle, pure black)
  ctx.fillStyle = '#1a1a1a';
  rrect(-14*s, -10*s, 28*s, 20*s*bodySY, 10*s); ctx.fill();

  // Belt (high saturation color band around waist)
  ctx.fillStyle = ch.scarf;
  rrect(-14*s, 2*s*bodySY, 28*s, 6*s, 0); ctx.fill();

  // Belt buckle (small white square)
  ctx.fillStyle = '#fff';
  ctx.fillRect(-2*s, 3*s*bodySY, 4*s, 4*s);

  // Arms (chunky blocks)
  ctx.fillStyle = '#1a1a1a';
  if (ch.state===STATES.TYPING) {
    const tOff = Math.sin(ch.anim*18)*6*s;
    rrect(-20*s, -8*s, 7*s, 14*s+tOff, 3*s); ctx.fill();
    rrect(13*s, -8*s, 7*s, 14*s-tOff, 3*s); ctx.fill();
  } else if (ch.state===STATES.WALKING) {
    rrect(-20*s, -6*s, 7*s, 12*s+legOff, 3*s); ctx.fill();
    rrect(13*s, -6*s, 7*s, 12*s-legOff, 3*s); ctx.fill();
  } else {
    rrect(-20*s, -8*s, 7*s, 14*s, 3*s); ctx.fill();
    rrect(13*s, -8*s, 7*s, 14*s, 3*s); ctx.fill();
  }

  // Head (rounded square with iconic curved corners/horns)
  ctx.fillStyle = '#1a1a1a';
  rrect(-13*s, -30*s, 26*s, 22*s, 8*s); ctx.fill();
  // Left horn/ear (rounded bump)
  ctx.beginPath();
  ctx.moveTo(-10*s, -30*s);
  ctx.quadraticCurveTo(-12*s, -40*s, -4*s, -38*s);
  ctx.lineTo(-2*s, -30*s);
  ctx.closePath(); ctx.fill();
  // Right horn/ear
  ctx.beginPath();
  ctx.moveTo(10*s, -30*s);
  ctx.quadraticCurveTo(12*s, -40*s, 4*s, -38*s);
  ctx.lineTo(2*s, -30*s);
  ctx.closePath(); ctx.fill();

  // Eyes (pure white ellipses + small black pupils)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-5*s, -22*s, 4.5*s, 5.5*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5*s, -22*s, 4.5*s, 5.5*s, 0, 0, Math.PI*2); ctx.fill();

  // Pupils
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-4*s, -21*s, 2*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6*s, -21*s, 2*s, 0, Math.PI*2); ctx.fill();

  // Sleeping: X eyes + Zzz
  if (ch.state===STATES.SLEEPING) {
    // Cover normal eyes
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(-5*s, -22*s, 4.5*s, 5.5*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5*s, -22*s, 4.5*s, 5.5*s, 0, 0, Math.PI*2); ctx.fill();
    // Draw X eyes
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5*s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-7*s, -24*s); ctx.lineTo(-3*s, -20*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3*s, -24*s); ctx.lineTo(-7*s, -20*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3*s, -24*s); ctx.lineTo(7*s, -20*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7*s, -24*s); ctx.lineTo(3*s, -20*s); ctx.stroke();
    // Zzz
    ctx.fillStyle = '#666';
    ctx.font = `bold ${6*s}px -apple-system, sans-serif`;
    ctx.fillText('z', 10*s, -34*s);
    ctx.font = `bold ${5*s}px -apple-system, sans-serif`;
    ctx.fillText('z', 15*s, -40*s);
  }

  // Name tag (below character)
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.font = `600 ${WS(10)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  const np = W(ch.x, ch.y + 32);
  ctx.fillText(ch.agent.name, np.x, np.y);
}

// ==================== STATUS BAR ====================
const bar = document.getElementById('status-bar');
chars.forEach(ch => {
  const div = document.createElement('div');
  div.className = 'status-item';
  div.id = 'st-'+ch.agent.id;
  div.innerHTML = `<span style="font-weight:600">${ch.agent.name}</span>
    <span class="status-dot" style="background:${STATE_COLORS[ch.state]};color:${STATE_COLORS[ch.state]}"></span>
    <span class="status-chip">${STATE_LABELS[ch.state]}</span>
    <span class="status-scarf" style="background:${ch.scarf}"></span>`;
  bar.appendChild(div);
  ch.updateUI();
});

// ==================== TOAST ====================
let toastT = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2200);
}

// ==================== MAIN LOOP ====================
let lastT = 0;
function loop(ts) {
  const dt = lastT ? Math.min((ts-lastT)/1000, 0.1) : 0.016;
  lastT = ts;

  // Smooth zoom
  cam.scale = lerp(cam.scale, cam.target, 0.12);

  chars.forEach(c => c.update(dt));

  // Background
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, CW, CH);

  drawZones();
  drawLabels();

  // Desks, monitors, chairs
  DESKS.forEach((d, i) => {
    let active = false;
    chars.forEach(ch => {
      if (ch.state===STATES.TYPING && dist(ch.x,ch.y,d.x,d.y+55)<10) active=true;
    });
    drawDesk(d.x, d.y);
    drawMonitor(d.x, d.y-45, active);
    drawChair(d.x, d.y+55);
  });

  drawBreakArea();
  drawTreadmill();
  drawSofa();

  // Characters sorted by y (back to front for isometric)
  [...chars].sort((a,b)=>a.y-b.y).forEach(c => drawChar(c));

  requestAnimationFrame(loop);
}

// ==================== INTERACTION ====================
let dragging = false, dsx=0, dsy=0, cox=0, coy=0;
canvas.addEventListener('mousedown', e => { dragging=true; dsx=e.clientX; dsy=e.clientY; cox=cam.ox; coy=cam.oy; });
window.addEventListener('mousemove', e => { if(!dragging) return; cam.ox=cox+(e.clientX-dsx); cam.oy=coy+(e.clientY-dsy); });
window.addEventListener('mouseup', () => dragging=false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.target = Math.max(0.5, Math.min(2, cam.target * (e.deltaY<0?1.08:0.93)));
}, { passive: false });
canvas.addEventListener('dblclick', () => { cam.ox=0; cam.oy=0; cam.target=1; showToast('View reset'); });

// Touch
canvas.addEventListener('touchstart', e => { if(e.touches.length===1){ dragging=true; dsx=e.touches[0].clientX; dsy=e.touches[0].clientY; cox=cam.ox; coy=cam.oy; } }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!dragging||e.touches.length!==1) return; cam.ox=cox-(e.touches[0].clientX-dsx)/cam.scale; cam.oy=coy-(e.touches[0].clientY-dsy)/cam.scale; }, {passive:false});
canvas.addEventListener('touchend', () => dragging=false);

// ==================== INIT ====================
cam.ox = 0; cam.oy = 0;
showToast('Lume Office ready ✨');
requestAnimationFrame(loop);
</script>
