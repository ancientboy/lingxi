<!-- 统一侧边栏组件 -->
<aside class="sidebar" id="sidebar">
  <!-- 品牌区域 -->
  <a href="index.html" class="sidebar-brand">
    <div class="sidebar-brand-icon">
      <i data-lucide="sparkles" class="icon-lg"></i>
    </div>
    <span class="sidebar-brand-name">Lume</span>
    <button class="sidebar-collapse-btn" onclick="event.preventDefault();event.stopPropagation();toggleSidebar()" title="收起侧边栏">
      <i data-lucide="panel-left-close" class="icon-sm"></i>
    </button>
  </a>
  
  <div class="sidebar-header">
    <button class="sidebar-new-chat" onclick="newChat()">
      <i data-lucide="plus" class="icon-sm"></i>
      <span>新对话</span>
    </button>
    <button class="sidebar-close" onclick="toggleSidebar()">
      <i data-lucide="x" class="icon-sm"></i>
    </button>
  </div>
  
  <!-- 🔧 快捷入口 -->
  <div class="sidebar-shortcuts">
    <button class="sidebar-shortcut-btn" onclick="switchView('workspace')">
      <i data-lucide="building" class="icon-sm"></i>
      <span>办公区</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="switchView('servers')">
      <i data-lucide="monitor-smartphone" class="icon-sm"></i>
      <span>设备管理</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="switchView('skills')">
      <i data-lucide="layout-grid" class="icon-sm"></i>
      <span>技能库</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="toggleFileExplorer()">
      <i data-lucide="folder-open" class="icon-sm"></i>
      <span>文件</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="window.open('cron.html','_blank')">
      <i data-lucide="clock" class="icon-sm"></i>
      <span>定时任务</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="window.open('memory.html','_blank')">
      <i data-lucide="brain" class="icon-sm"></i>
      <span>记忆</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="window.open('triggers.html','_blank')">
      <i data-lucide="webhook" class="icon-sm"></i>
      <span>触发器</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="window.open('knowledge.html','_blank')">
      <i data-lucide="book-open" class="icon-sm"></i>
      <span>知识库</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="window.open('market.html','_blank')">
      <i data-lucide="store" class="icon-sm"></i>
      <span>市场</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="window.open('workflows.html','_blank')">
      <i data-lucide="workflow" class="icon-sm"></i>
      <span>工作流</span>
    </button>
    <button class="sidebar-shortcut-btn" onclick="toggleAgentDropdown()" style="position:relative;">
      <i data-lucide="zap" class="icon-sm" id="currentAgentIcon"></i>
      <span>切换Agent</span>
      <div class="agent-dropdown" id="agentDropdown"></div>
    </button>
  </div>
  
  <div class="sidebar-content">
    <div class="sidebar-section">
      <div class="sidebar-section-title">今天</div>
      <div class="sidebar-sessions" id="todaySessions"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">最近 7 天</div>
      <div class="sidebar-sessions" id="weekSessions"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">更早</div>
      <div class="sidebar-sessions" id="olderSessions"></div>
    </div>
  </div>
  
  
  <!-- 底部用户区 -->
  <div class="sidebar-footer">
    <div class="sidebar-user-trigger" onclick="toggleUserMenu()">
      <div class="sidebar-user-avatar-wrapper">
        <div class="sidebar-user-avatar" id="sidebarUserAvatar">U</div>
        <div class="sidebar-user-badge" id="sidebarUserBadge"></div>
      </div>
      <span class="sidebar-user-name" id="sidebarUserName">用户</span>
      <span class="sidebar-user-credits" id="sidebarUserCredits">💎 0</span>
      <span class="sidebar-user-arrow">▼</span>
    </div>
    <div class="sidebar-user-menu" id="sidebarUserMenu">
      <div class="sidebar-menu-item" onclick="openLumeClaw()" id="lumeclawMenuEntry" style="display: none;">
        <i data-lucide="bot" class="icon-sm"></i>
        <span>LumeClaw</span>
      </div>
      <div class="sidebar-menu-item" onclick="handleCheckin()" id="checkinBtn">
        <i data-lucide="calendar" class="icon-sm"></i>
        <span>每日签到</span>
        <span class="checkin-points" id="checkinPoints" style="margin-left:auto;font-size:0.75rem;color:#10a37f;"></span>
      </div>
      <div class="sidebar-menu-item" onclick="showUsageStats()">
        <i data-lucide="bar-chart-2" class="icon-sm"></i>
        <span>使用量统计</span>
      </div>
      <div class="sidebar-menu-item" onclick="showSubscription()">
        <i data-lucide="credit-card" class="icon-sm"></i>
        <span>我的订阅</span>
      </div>
      <div class="sidebar-menu-item" onclick="toggleTheme()">
        <i data-lucide="moon" class="icon-sm" id="themeToggleIcon"></i>
        <span>切换主题</span>
      </div>
      <div class="sidebar-menu-item" onclick="showFeishuConfig()">
        <i data-lucide="message-square" class="icon-sm"></i>
        <span>飞书配置</span>
      </div>
      <div class="sidebar-menu-divider"></div>
      <div class="sidebar-menu-item" onclick="showPasswordChange()">
        <i data-lucide="lock" class="icon-sm"></i>
        <span>修改密码</span>
      </div>
      <div class="sidebar-menu-item" onclick="showAbout()">
        <i data-lucide="info" class="icon-sm"></i>
        <span>关于</span>
      </div>
      <div class="sidebar-menu-item" onclick="logout()">
        <i data-lucide="log-out" class="icon-sm"></i>
        <span>退出登录</span>
      </div>
    </div>
  </div>
</aside>
