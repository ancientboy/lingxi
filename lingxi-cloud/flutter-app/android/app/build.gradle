plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "cn.lumeword.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // 🔔 启用 core library desugaring（flutter_local_notifications 需要）
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // 签名配置
    signingConfigs {
        debug {
            storeFile file('/root/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('lume-release.keystore')
            storePassword 'Lume@2026!'
            keyAlias 'lume'
            keyPassword 'Lume@2026!'
        }
    }

    defaultConfig {
        applicationId "cn.lumeword.app"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // 包含主流架构（arm64 + armeabi-v7a），兼容华为等设备
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            // 混淆开启但保留必要的规则
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    // 自定义 APK 输出文件名
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def projectAppFlavorName = output.name
            if (projectAppFlavorName.contains("release")) {
                outputFileName = "lume-v${flutterVersionName}.apk"
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // 🔔 Core library desugaring（flutter_local_notifications 需要）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
}
