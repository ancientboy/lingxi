<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 36px 40px;
      background: #f7f4ef;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #2c3e35;
      width: 920px;
    }
    h1 { font-size: 20px; color: #3d6b62; margin: 0 0 6px; }
    .sub { font-size: 12px; color: #6b7c74; margin-bottom: 24px; }
    .section { margin-bottom: 22px; }
    .section-title { font-size: 14px; font-weight: 600; color: #3d6b62; margin-bottom: 2px; }
    .section-story { font-size: 11px; color: #6b7c74; margin-bottom: 10px; }
    .row { display: flex; gap: 14px; }
    .item {
      background: #fffdf9;
      border: 1px solid rgba(61,107,98,0.14);
      border-radius: 12px;
      padding: 14px 10px 10px;
      width: 130px;
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 6px;
      color: #3d6b62;
    }
    .mark svg { width: 100%; height: 100%; display: block; }
    .label { font-weight: 600; font-size: 13px; }
    .desc { font-size: 10px; color: #6b7c74; margin-top: 3px; }
  </style>
</head>
<body>
  <h1>Lume Logo — 叙事方向 A / B / D</h1>
  <p class="sub">品牌色 #3d6b62</p>

  <div class="section">
    <div class="section-title">A — 编队 / 开口环 · 你编排，他们入列</div>
    <div class="section-story">星芒=意图 · 开口环=协作场 · 圆点=伙伴</div>
    <div class="row">
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><path d="M 31.2 12.2 A 17.2 17.2 0 1 1 31.2 35.8" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M 16.8 35.8 A 17.2 17.2 0 1 1 16.8 12.2" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><circle cx="30.8" cy="14.6" r="2.15" fill="currentColor"/><path fill="currentColor" d="M24 4.8Q27.2 19.2 34.2 23.6Q27.4 27.2 24 43.2Q20.6 27.2 13.8 23.6Q20.8 19.2 24 4.8Z"/></svg></div><div class="label">A1</div><div class="desc">参考平衡</div></div>
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><path d="M 32.2 10.8 A 18.5 18.5 0 1 1 32.2 37.2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><path d="M 15.8 37.2 A 18.5 18.5 0 1 1 15.8 10.8" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="30.4" cy="14.2" r="2" fill="currentColor"/><path fill="currentColor" d="M24 5.2Q26.8 19.4 33.6 23.4Q27 27 24 42.4Q21 27 14.4 23.4Q21.2 19.4 24 5.2Z"/></svg></div><div class="label">A2</div><div class="desc">开口更大</div></div>
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><path d="M 31 12 A 17.5 17.5 0 1 1 31 36" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><path d="M 17 36 A 17.5 17.5 0 1 1 17 12" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/><circle cx="30.6" cy="14.8" r="2" fill="currentColor"/><circle cx="17.2" cy="31.6" r="1.35" fill="currentColor" opacity="0.62"/><path fill="currentColor" d="M24 5Q27 19.2 34 23.5Q27.2 27 24 42.8Q20.8 27 14 23.5Q21 19.2 24 5Z"/></svg></div><div class="label">A3</div><div class="desc">双点编队</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">B — 协奏 / 多节点 · 一人编排，多人协奏</div>
    <div class="section-story">锚点=人 · 多节点=Agent 各就各位</div>
    <div class="row">
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><path d="M 30.8 13.2 A 16.5 16.5 0 1 1 30.8 34.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/><path d="M 17.2 34.8 A 16.5 16.5 0 1 1 17.2 13.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/><circle cx="31.2" cy="14.2" r="1.85" fill="currentColor"/><circle cx="16.8" cy="18.4" r="1.45" fill="currentColor" opacity="0.78"/><circle cx="28.4" cy="32.2" r="1.15" fill="currentColor" opacity="0.52"/><path fill="currentColor" d="M24 9.2Q26.2 19.8 31.8 22.8Q26.4 25.2 24 38.8Q21.6 25.2 18.2 22.8Q23.8 19.8 24 9.2Z"/></svg></div><div class="label">B1</div><div class="desc">三星编队</div></div>
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><path d="M 31.4 12.4 A 17.2 17.2 0 1 1 31.4 35.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M 16.6 35.6 A 17.2 17.2 0 1 1 16.6 12.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="24" cy="24" r="2.9" fill="currentColor"/><circle cx="32.2" cy="15.8" r="1.75" fill="currentColor" opacity="0.88"/><circle cx="15.4" cy="32.6" r="1.55" fill="currentColor" opacity="0.68"/></svg></div><div class="label">B2</div><div class="desc">实心锚点</div></div>
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="2.6" fill="currentColor"/><path d="M 30.5 14.2 A 14 14 0 0 1 35.8 22.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="35.8" cy="22.5" r="1.5" fill="currentColor" opacity="0.82"/><path d="M 17.2 33.8 A 14 14 0 0 1 12.2 26" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="12.2" cy="26" r="1.35" fill="currentColor" opacity="0.65"/><path d="M 22.8 10.5 A 14 14 0 0 1 28.2 12.8" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="28.2" cy="12.8" r="1.2" fill="currentColor" opacity="0.5"/></svg></div><div class="label">B3</div><div class="desc">轨道弧线</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">D — 灵犀 / 感应 · 懂你所想，伴你而行</div>
    <div class="section-story">双轨并行 · 近而不融</div>
    <div class="row">
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><path d="M 13.5 14.5 Q 21 24 13.5 33.5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/><path d="M 34.5 14.5 Q 27 24 34.5 33.5" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/><circle cx="14.8" cy="15.2" r="1.6" fill="currentColor" opacity="0.75"/><circle cx="33.2" cy="15.2" r="1.6" fill="currentColor" opacity="0.75"/></svg></div><div class="label">D1</div><div class="desc">双轨并行</div></div>
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><path fill="currentColor" d="M24 10Q26.4 20.2 31.2 23.2Q26.6 25.8 24 38Q21.4 25.8 18.8 23.2Q23.6 20.2 24 10Z"/><circle cx="31.8" cy="15.6" r="2" fill="currentColor"/><path d="M 26.2 16.8 Q 28.8 18.2 30.2 15.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.38"/></svg></div><div class="label">D2</div><div class="desc">感应弧线</div></div>
      <div class="item"><div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none"><path d="M 30.6 13 A 16.8 16.8 0 1 1 30.6 35" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" opacity="0.4"/><path d="M 17.4 35 A 16.8 16.8 0 1 1 17.4 13" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" opacity="0.4"/><path d="M 15.8 17.2 Q 22.5 24 15.8 30.8" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M 32.2 17.2 Q 25.5 24 32.2 30.8" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/></svg></div><div class="label">D3</div><div class="desc">淡环双轨</div></div>
    </div>
  </div>
</body>
</html>
