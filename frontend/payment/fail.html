<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付失败 - Lume</title>
  <link rel="stylesheet" href="../assets/css/lume.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }
    .container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #f87171, #ef4444);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg {
      width: 36px;
      height: 36px;
      stroke: white;
      stroke-width: 3;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text-1);
      margin-bottom: 12px;
    }
    p { color: var(--text-2); margin-bottom: 8px; }
    .message {
      background: var(--danger-soft);
      color: #991b1b;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      margin: 20px 0;
      font-size: 14px;
    }
    .btn {
      display: inline-block;
      background: var(--accent-gradient);
      color: white;
      padding: 14px 40px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
      margin-top: 24px;
    }
    .btn:hover { background: var(--accent-h); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <h1>支付失败</h1>
    <p>您的订单支付未能完成</p>
    <div class="message" id="message">请重试或联系客服</div>
    <a href="/chat.html" class="btn">返回重试</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('message').textContent = params.get('message') || '请重试或联系客服';
  </script>
</body>
</html>
