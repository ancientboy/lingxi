<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付成功 - Lume</title>
  <link rel="stylesheet" href="../assets/css/lume.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }
    .container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: scale 0.5s ease;
    }
    @keyframes scale {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    .icon svg {
      width: 36px;
      height: 36px;
      stroke: white;
      stroke-width: 3;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text-1);
      margin-bottom: 12px;
    }
    p { color: var(--text-2); margin-bottom: 8px; }
    .amount {
      font-size: 32px;
      font-weight: 700;
      color: #16a34a;
      margin: 20px 0;
      font-family: var(--font-display);
    }
    .countdown { color: var(--text-3); font-size: 14px; margin-top: 20px; }
    .btn {
      display: inline-block;
      background: var(--accent-gradient);
      color: white;
      padding: 14px 40px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
      margin-top: 24px;
      transition: background var(--transition);
    }
    .btn:hover { background: var(--accent-h); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>支付成功</h1>
    <p>您的订阅已开通</p>
    <div class="amount" id="amount">¥--</div>
    <p class="countdown"><span id="count">3</span> 秒后自动返回...</p>
    <a href="/chat.html" class="btn">立即返回</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('amount').textContent = '¥' + (params.get('total_amount') || '0.00');
    let count = 3;
    const timer = setInterval(() => {
      count--;
      document.getElementById('count').textContent = count;
      if (count <= 0) {
        clearInterval(timer);
        window.location.href = '/chat.html';
      }
    }, 1000);
  </script>
</body>
</html>
