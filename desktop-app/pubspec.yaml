name: lume_desktop
description: Lume desktop client — native shell for lumeword.cn (macOS / Windows / Linux).
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.4.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.22.0
  flutter_svg: ^2.2.0
  window_manager: ^0.4.3
  flutter_local_notifications: ^19.0.0
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/lume-mark.svg
